# Arcanea ecosystem manifest — curated source of truth.
#
# This file overlays/extends the sibling-repos scan (.arcanea/config/repos.json)
# and the monorepo package scan. It feeds the ecosystem build pipeline at
# packages/orchestrator/src/ecosystem/build.ts and is consumed by the
# ecosystem-verify CI workflow.
#
# Add a node here when it cannot be inferred from a sibling repo or workspace
# package alone — e.g. external services (Anthropic SDK, Supabase, Vercel),
# books, in-repo surfaces, or curated overrides on a sibling repo.

nodes:
  # --- External / substrate services ---
  - id: anthropic-sdk
    name: Anthropic SDK
    description: Claude Sonnet/Opus/Haiku via @anthropic-ai/sdk
    layer: substrate
    gate: source
    hemisphere: seam
    consumes: []
    isExternal: true
    links:
      docs: https://docs.anthropic.com

  - id: supabase
    name: Supabase
    description: Postgres, Auth, Realtime, Storage, pgvector
    layer: substrate
    gate: pattern
    hemisphere: seam
    consumes: []
    isExternal: true
    links:
      docs: https://supabase.com/docs

  - id: vercel
    name: Vercel
    description: Hosting, Fluid Compute, AI Gateway, Functions, Blob, Queues
    layer: substrate
    gate: mastery
    hemisphere: nea
    consumes: []
    isExternal: true
    links:
      docs: https://vercel.com/docs

  # --- Curated sibling-repo overlays ---
