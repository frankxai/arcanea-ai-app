acknowledgments: |
  Sixth book in the Arcanea Author Team set. First novella-format work.
  Companion to .arcanea/lore/PRISM_LUXIN_SYSTEM.md — the Prism-Luxin
  canon expansion that fully absorbs Brent Weeks' Lightbringer chromatic-
  drafting magic system into Arcanean canon at the practitioner-level.

  Lineage: Brent Weeks' Lightbringer (chromatic mechanics homage), Lois
  McMaster Bujold's late Vorkosigan (institutional attention), Susanna
  Clarke's Piranesi (single-chamber gravity), Le Guin's The Dispossessed
  (political weight of choice within constraint).

  Setting: the Hall of White, in House Synthesis's Cinderwall complex,
  Year 799 of the Eighth Age — twelve months into the Seventh League.
  Protagonist: Lysara Sablecourt, the current White of the Order of
  Refracted Light, approaching Halo's Edge with sustained Prism State
  capacity. The threshold question: White Aspirant emergence or slow-curve
  Wight transformation? The Order cannot tell which.

  Spiritual signature: "The light came back through the prism. She came
  back through the light."

  Published on Arcanea — written in the open. CC-BY-NC-SA-4.0.

