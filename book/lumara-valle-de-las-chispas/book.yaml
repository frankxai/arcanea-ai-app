magic_system: |
  Las florchispas — flores chiquitas de cinco pétalos, plata y oro, que crecen
  por todo el valle de Lumara. Cuando Lila saluda a una criatura con tres
  saludos verdaderos (su nombre en español, su nombre en inglés, y un silencio
  atento), los cinco pétalos de una florchispa cercana se encienden uno por uno
  hasta brillar enteros. La criatura entonces le regala a Lila su nombre
  verdadero — el sonido más profundo de lo que es. Lila lo guarda. Cada nombre
  vuelve a casa con ella, como una chispa nueva flotando junto a la llama del
  farolito de su abuela.

  La magia no se trata de hechizos. Se trata de prestar atención.

