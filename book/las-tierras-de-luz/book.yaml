target_reader: |
  Feminine, 25-45, mystic-seeker who reads epic fantasy. Spanish-language identity
  central but not gatekept — readers who code-switch between English and Spanish daily
  will recognize themselves. Knows enough about Kabbalah, Hindu tantra, or Buddhist
  meditation to feel the cosmology land; does not need a glossary. Has been told her
  whole life that what she sees is imagination, and is one good book away from
  believing herself.

acknowledgments: |
  In Caracas, Venezuela, a nineteen-year-old named Selene Velara climbs the Ávila
  mountain alone at dawn on the eve of her birthday — and the mountain speaks her
  name back. By nightfall her grandmother has opened a corridor that closed sixty
  years ago, and Selene steps through into Avilara, a sister-Realm of the Kingdom of
  Light she has only ever heard about in recipes and songs. The Arcanea Academy of
  Light is waiting for her. A first dungeon. A Godbeast hatchling. A friend whose
  bloodline carries three of the Outer-World Echoes. And ten chambers beneath
  Crystalpeak Citadel where what you deny is made into a room around you.

  Canon-aligned with the Legends of Arcanea — Lumina/Nero duality, Ten Gates, the
  Seven Academy Houses, Malachar sealed in Shadowfen. The historical mystic
  traditions of our world (Kabbalah, Vedic, Buddhist, Hermetic, Sufi) appear in-world
  as Outer-World Echoes — fragmentary reflections of the same underlying truth the
  Academy teaches directly through frequency, breath, element, image.

  This is the canonical Terras de Luz. A sister novella set in Veldoria — quieter,
  literary, eleven-year-old protagonist — is preserved at
  `book/las-tierras-de-luz-valle-v0/` as a Tier-2 Legend of the Kingdom of Light.
