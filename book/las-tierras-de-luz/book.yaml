acknowledgments: |
  In the valley-Realm of Veldoria, an eleven-year-old named Mira wakes one morning to find a
  small prismatic light hovering above her chest. Soon she discovers she can wake the sleeping
  lights in every being she passes — and that no one else can see them. Across the narrow street,
  behind a blue door, an old woman who has been waiting her whole adult life looks up from a
  bowl of green beans and sees. A magical-realism novel of the Kingdom of Light — about the
  loneliness of the first witness, the three notes that crossed a lost Realm-corridor to find
  her, and the quiet joy that lives beneath every ordinary day.

  World-building by the Arcanea Author Team multi-agent dispatch. Canon-aligned with the
  Legends of Arcanea — Nero/Lumina duality, Ten Gates, Yggdrasil's World Song, Malachar sealed.
  Voice engineered for the bilingual literary reader. Written in the open.
