  method: |
    Biographical memoir-fiction. Based on the life of Ruslan — a friend of
    the writer (FrankX) — born 1985 in Uzbekistan, displaced to St. Petersburg
    and Moscow, returned to Tashkent for the hotel → Chirchiq Transformer
    Plant → US Embassy career arc. The protagonist's "I" voice is Ruslan's,
    rendered by Frank with Ruslan's consent. Five specialist agents dispatched
    in parallel via /arcanea-author (World Architect, Character Psychologist,
    Deep Fiction Master, Sensitivity Reader, Research Librarian) built the
    bibles before any prose. Cover via NB2 (Gemini 3.1 Flash Image Preview)
    using /arcanea-book-cover 5-phase method.
    Off-Arcanea-canon — realist literary fiction.

