magic_system: |
  These texts are not a magic system but the principles every magic system in
  Arcanea rests on: love as the openness that opens the Ten Gates; fear as the
  contraction that closes them; the ego's grasp as the road to the Dimming
  (Malachar's fall at human scale); the Arc (Potential → Manifestation →
  Experience → Dissolution → Evolved Potential) as the practice of building a
  life; the ten Guardians as inner capacities; and creation as the antidote to
  Shadow's separation. The Convergent holds the whole light by not grasping it;
  these five truths teach the same discipline to anyone.

