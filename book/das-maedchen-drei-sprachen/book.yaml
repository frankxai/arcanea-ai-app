magic_system: |
  Smilje (Helichrysum italicum / Strohblume / immortelle) — eine echte Pflanze
  auf den Inseln Kroatiens, die ihre goldene Farbe nie verliert. Wenn Mila ein
  Lebewesen in allen drei Sprachen begrüßt (Deutsch, Kroatisch, Englisch),
  pulsiert das Smilje einmal kurz golden und teilt ihr ein wahres sinnliches
  Geheimnis dieses Wesens mit. Magie kann den Umzug nicht rückgängig machen.
  Magie kann nur das Sehen lehren.

acknowledgments: |
  Geschrieben für ein sechsjähriges Kind im Übergang zwischen Deutschland
  und Kroatien. Author-team orchestrated by Master Story Architect: World
  Architect, Character Psychologist, Deep Fiction Master, Sensitivity Reader,
  Research Librarian. Voice DNA aus Janosch, Astrid Lindgren (Saltkrokan),
  Cornelia Funke (Adriatic), Otfried Preußler, Ivana Brlić-Mažuranić, mit
  Studio-Ghibli-Lehrtechniken (Ma / Stille als Lehre, Tier ohne Sprache,
