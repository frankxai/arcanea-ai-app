magic_system: |
  Built on the Convergent canon (.arcanea/lore/convergent/). Arion is the Eighth
  Age's emerging Convergent — the Architect who might choose to stay — and his arc
  is the discipline of non-grasping (hold the whole light without clenching it;
  the alternative is the Dimming, Malachar's fall). Mera works the Frequency/
  observation register; Emilia integrates Prism-Luxin drafting with dragon-bond
  flight. No named prophecy: Arion is never foretold by name; he earns it.

acknowledgments: |
  Authored 2026-06-25 under Frank's God-mode autonomous-expansion mandate as the
  dedicated story for the Convergent canon. Composed by the Character Psychologist
  against CHARACTER_TEMPLATE.md (12-field stack + Character Diamond) and the
  arcanea-voice guide. Placed as a parallel chronicle to the Malachar Cycle (no
  shared protagonists; the Fracture Prophecy remains thematic, not name-bearing).
  STAGING until the Creator promotes to LOCKED. One Creator-ruling item is flagged
  in akamoto.md (whether to restore prior prophecy-reveal framing).
