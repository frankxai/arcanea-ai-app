magic_system: |
  Los destellos — chispitas de luz, la unidad fundamental de la magia en Lumara,
  alineadas con la cosmología canónica de Arcanea (destellos como abundancia,
  no fractura). Cada noche el farolito de la abuela de Lila se parte en cien
  destellitos que la guían a través de la puerta de luz de luna hacia el valle.

  Las florchispas son flores chiquitas de cinco pétalos, plata y oro, que crecen
  por todo Lumara. Cada florchispa guarda un destellito en su corazón dorado.
  Cuando Lila saluda a una criatura con tres saludos verdaderos (su nombre en
  español, su nombre en inglés, y un silencio atento), los cinco pétalos de
  la florchispa más cercana se encienden uno por uno hasta brillar enteros.
  La criatura entonces le regala a Lila su nombre verdadero — el sonido más
  profundo de lo que es. Lila lo guarda como un destello nuevo flotando junto
  a la llama del farolito de su abuela.

  La magia no se trata de hechizos. Se trata de prestar atención.

acknowledgments: |
  Escrito como un regalo para que Ana se lo lea a su sobrinita. Misma forma
  que el libro de Mila (Das Mädchen, das drei Sprachen hörte). Voz inspirada
  por Saint-Exupéry (El Principito), Astrid Lindgren, Estudio Ghibli (Ma /
  el silencio como enseñanza), Cornelia Funke, y la propia abuela del lector.
  Publicado en Arcanea — escrito a la luz del farolito.

  Voz objetivo: mostrar, no contar. Lots of dialogue. Lila habla mucho —
  consigo misma, con Conejito, con cada criatura. Cada capítulo es para que
  Ana y su sobrinita se prendan al leerlo juntas.

