name: AI Exact-Head Review

# Trusted-base autonomous reviewer. It deliberately reads PR metadata and diff
# through GitHub's API instead of checking out untrusted PR code with secrets.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: ai-exact-head-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Exact-Head Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout protected base only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Review exact PR head
        id: review
        continue-on-error: true
        run: node scripts/ai-exact-head-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish sticky verdict
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-exact-head-review -->';
            const fallback = `${marker}\n## AI Exact-Head Review — BLOCK\n\nThe reviewer exited before producing a verdict. This gate fails closed.`;
            const body = fs.existsSync('ai-exact-head-review.md')
              ? fs.readFileSync('ai-exact-head-review.md', 'utf8')
              : fallback;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Enforce autonomous verdict
        if: steps.review.outcome != 'success'
        run: exit 1
