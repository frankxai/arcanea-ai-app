name: Aiyami Submission Swarm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'book/**'
      - 'world/**'
  workflow_dispatch:

concurrency:
  group: submission-swarm-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: write` is what the sticky compliance comment needs; the issues
# API path used to read/post it resolves through the pull request, so no
# repository-wide `issues: write` is granted.
permissions:
  contents: read
  pull-requests: write

jobs:
  aiyami-swarm:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Aiyami Guard — Compliance, Tone & Plagiarism Swarm

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for structural plagiarism and author checks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Aiyami Guard Analysis Swarm
        id: aiyami_guard
        run: |
          python scripts/aiyami-compliance.py
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Post Compliance Report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = 'aiyami-report.md';
            
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              
              // Find existing report comment to prevent spamming
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const existingComment = comments.find(c => c.body.includes('Aiyami Submission Swarm Report'));
              
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body
                });
                console.log('Updated existing Aiyami report comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
                console.log('Created new Aiyami report comment.');
              }
            } else {
              console.log('No compliance report found to post.');
            }
