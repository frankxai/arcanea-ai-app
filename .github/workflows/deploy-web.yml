name: Deploy Arcanea Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'

jobs:
  validate-web:
    name: Validate Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (via turbo — builds workspace deps first)
        run: pnpm turbo run type-check --filter=@arcanea/web

      - name: Lint
        run: pnpm --filter @arcanea/web lint
        continue-on-error: true

      - name: Build (via turbo — builds workspace deps first)
        run: pnpm turbo run build --filter=@arcanea/web
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://arcanea.ai' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Install Playwright browsers
        run: pnpm --filter @arcanea/web exec playwright install --with-deps chromium

      - name: Run smoke tests
        # NOTE: invoke playwright directly via `pnpm exec` to avoid the
        # `pnpm script -- --flag` quoting trap. pnpm forwards `--`, `--grep`,
        # `@smoke` as 3 separate positional args, which makes playwright
        # interpret `--` as a test-file regex and find no tests. `pnpm exec`
        # runs the binary directly with clean argv. Salvaged from the
        # superseded fix/ci-deploy-web-smoke-test-2026-05-07 branch.
        run: pnpm --filter @arcanea/web exec playwright test --grep @smoke
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://arcanea.ai' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: validate-web
    # Skip if VERCEL_TOKEN not configured — Vercel's GitHub integration
    # handles auto-deploys natively, so this CLI-driven path is optional.
    # Without the token, this job would fail with 'No existing credentials'
    # and turn main red even though the actual site deploys fine.
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview')) && vars.HAS_VERCEL_TOKEN == 'true' }}
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Vercel CLI
        run: pnpm install -g vercel@latest

      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          vercel deploy --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
          echo "preview_url=$(cat deployment-url.txt)" >> $GITHUB_OUTPUT

      - name: Write preview summary
        run: |
          echo "## Preview Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.deploy.outputs.preview_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: validate-web
    # Skip if VERCEL_TOKEN not configured — Vercel's GitHub integration
    # handles production deploys natively when the repo is linked to the
    # Vercel project. To re-enable CLI-driven deploys, set repo variable
    # HAS_VERCEL_TOKEN=true and add VERCEL_TOKEN to repo secrets.
    if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && vars.HAS_VERCEL_TOKEN == 'true' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Vercel CLI
        run: pnpm install -g vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
          echo "production_url=$(cat deployment-url.txt)" >> $GITHUB_OUTPUT

      - name: Write production summary
        run: |
          echo "## Production Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.deploy.outputs.production_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-production
    if: needs.deploy-production.result == 'success'

    steps:
      - name: Wait for propagation
        run: sleep 30

      - name: Check site health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://arcanea.ai)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Site health check failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Check API health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://arcanea.ai/api/health)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "API health check returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write health summary
        run: |
          echo "## Production Health Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://arcanea.ai" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://arcanea.ai/api/health" >> $GITHUB_STEP_SUMMARY
