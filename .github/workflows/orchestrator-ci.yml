name: Orchestrator CI

on:
  push:
    branches: [main]
    paths:
      - "packages/orchestrator/**"
      - "packages/router-spec/**"
      - ".github/workflows/orchestrator-ci.yml"
  pull_request:
    # ready_for_review re-fires the draft-gated job(s) below; without it a gated
    # job skips on the draft and never reports once the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/orchestrator/**"
      - "packages/router-spec/**"
      - ".github/workflows/orchestrator-ci.yml"

# Scoped to the two orchestrator packages. Does NOT gate the whole monorepo.
# Failure here only blocks orchestrator-touching PRs.

concurrency:
  group: orchestrator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Cost gate: skip on draft PRs — agents iterate free; the suite runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install deps for orchestrator packages only
        run: pnpm install --filter "@arcanea/router-spec" --filter "@arcanea/orchestrator" --frozen-lockfile=false

      - name: Validate router spec
        run: pnpm --filter "@arcanea/router-spec" validate

      - name: Build router spec
        run: pnpm --filter "@arcanea/router-spec" build

      - name: Build orchestrator
        run: pnpm --filter "@arcanea/orchestrator" build

      - name: Test router spec
        run: pnpm --filter "@arcanea/router-spec" test

      - name: Test orchestrator
        run: pnpm --filter "@arcanea/orchestrator" test
