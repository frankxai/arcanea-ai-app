name: Publish @arcanea/mcp-server

# Manual only, main only. Two jobs so the OIDC token never shares a runner with
# checked-out code or installed dependencies:
#   build    tests, smokes and packs with no publish rights, uploads the tarball
#            and records its sha256
#   publish  holds id-token, runs no repository code, verifies the downloaded
#            tarball against that sha256 and publishes exactly that file
# Every action is pinned to a full commit SHA. Node 24.21.0 bundles npm 11.19.0,
# above the 11.5.1 trusted publishing needs, so nothing is installed at publish time.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and npm publish --dry-run, without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-mcp-server
  cancel-in-progress: false

env:
  PNPM_VERSION: "8.15.0"
  NODE_VERSION: "24.21.0"

jobs:
  build:
    name: Test, smoke and pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.digest.outputs.tarball }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install MCP server dependencies
        run: pnpm install --frozen-lockfile --filter @arcanea/mcp-server

      - name: Vendored canon is the pinned public mirror
        run: node packages/arcanea-mcp/scripts/verify-public-canon.mjs --remote

      - name: WorldPack engine tests
        run: node --test packages/world-pack/tests/*.test.mjs

      - name: WorldPack tools, hardening, public canon, workflow and counts
        run: pnpm --dir packages/arcanea-mcp test:worldpack

      - name: Refuse a version that is already on npm
        run: |
          VERSION=$(node -p "require('./packages/arcanea-mcp/package.json').version")
          if npm view "@arcanea/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@arcanea/mcp-server@$VERSION is already published. Bump the version first."
            exit 1
          fi

      - name: Consumer install smoke
        id: smoke
        run: node packages/arcanea-mcp/scripts/consumer-smoke.mjs --no-build --pack-destination "$RUNNER_TEMP/mcp-tarball"

      - name: Record tarball sha256
        id: digest
        env:
          TARBALL: ${{ steps.smoke.outputs.tarball }}
        run: |
          echo "tarball=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-server-tarball
          path: ${{ steps.smoke.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the verified tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-server-tarball
          path: tarball

      - name: Verify tarball sha256
        env:
          TARBALL: tarball/${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "$EXPECTED  $TARBALL" | sha256sum --check --strict

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        env:
          TARBALL: tarball/${{ needs.build.outputs.tarball }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          flags=(--access public)
          # npm refuses provenance from private repositories, even for public packages.
          if [ "$REPO_PRIVATE" = "false" ]; then
            flags+=(--provenance)
          else
            echo "::warning::Repository is private; npm cannot attach provenance. Publishing via OIDC without it."
          fi
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          npm publish "$TARBALL" "${flags[@]}"
