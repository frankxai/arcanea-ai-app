name: Lockfile Drift Check

# Blocks PRs that change a package.json dependency field without committing the
# corresponding pnpm-lock.yaml change (scripts/lockfile-drift.mjs). Metadata-only
# edits (description, scripts, version) pass. Catches the recurring main-break pattern:
#   2026-05-04 PR #77 — package.json changed, lockfile not committed → main red
#   2026-05-05 PR #87 — same pattern → main red 5 days
#
# When this fires, the PR author must:
#   1. Run `pnpm install` locally
#   2. Stage and commit the updated pnpm-lock.yaml
#   3. Push to the same branch

on:
  pull_request:
    branches: [main]
    # ready_for_review re-fires the draft-gated job(s) below; without it a gated
    # job skips on the draft and never reports once the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "scripts/lockfile-drift.mjs"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lockfile-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    # Cost gate: skip on draft PRs — agents iterate free; the drift check runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Verify lockfile matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails only when a dependency field changed without a lockfile change; description,
      # script and version edits pass here and are still verified by the frozen install below.
      - name: Compare dependency changes vs pnpm-lock.yaml in PR
        id: drift
        run: |
          if ! node scripts/lockfile-drift.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"; then
            echo "## Lockfile drift detected" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run \`pnpm install\` locally, then stage and commit \`pnpm-lock.yaml\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## Lockfile in sync" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        uses: pnpm/action-setup@v4
        with:
          version: "8.15.0"

      - name: Setup Node.js
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify --frozen-lockfile install succeeds
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        run: |
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install-output.txt
          if grep -q "ERR_PNPM_OUTDATED_LOCKFILE\|ERR_PNPM_LOCKFILE_BREAKING_CHANGE" /tmp/install-output.txt; then
            echo "::error::pnpm-lock.yaml is out of sync with package.json"
            echo "## Lockfile out of sync" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run \`pnpm install\` locally, then commit the updated lockfile." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify web lint runtime contract
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        run: pnpm run verify:web-lint-runtime

      - name: Verify runtime engine contracts
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        run: pnpm run verify:runtime-contracts

      - name: Resolve declared runtime floor
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        id: runtime-floor
        run: |
          echo "version=$(node -e 'console.log(require("semver").minVersion(require("./package.json").engines.node).version)')" >> "$GITHUB_OUTPUT"

      - name: Setup minimum supported Node.js
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime-floor.outputs.version }}

      - name: Smoke-test runtime dependencies at declared floor
        if: steps.drift.outputs.pkg_changed != '0' || steps.drift.outputs.lock_changed != '0'
        run: |
          pnpm run verify:runtime-contracts
          pnpm --dir packages/media build
          pnpm --dir packages/media exec node --input-type=module -e "await import('./dist/index.js')"
          pnpm --dir packages/media exec node --input-type=module -e "const sharp = await import('sharp'); await import('glob'); console.log('media runtime: sharp ' + sharp.default.versions.sharp)"
          pnpm --dir apps/web exec node --input-type=module -e "await import('next'); const sharp = await import('sharp'); console.log('web runtime: sharp ' + sharp.default.versions.sharp)"
