name: Source-linked world scenes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/world-sdk/**"
      - ".github/workflows/world-scenes.yml"
  push:
    branches: [main]
    paths:
      - "packages/world-sdk/**"
      - ".github/workflows/world-scenes.yml"

permissions:
  contents: read

jobs:
  scenes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify SDK and actual CLI recovery with no provider calls
        run: node --test packages/world-sdk/tests/*.test.mjs
