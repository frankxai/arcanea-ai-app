# Dependabot auto-merge, fail-closed. Copy this to .github/workflows/ in a target repo.
# Policy: docs/AUTO-MERGE-AND-AGENTIC-REVIEW.md (Tier 0). Tests: scripts/tests/test_dependabot_automerge.sh
#
# It arms GitHub's native auto-merge only when ALL of these hold:
#   1. The PR is from dependabot[bot] and comes from this repo, not a fork.
#   2. EVERY updated dependency (grouped PRs included) is a semver-patch, or a semver-minor
#      from a version >= 1.0.0.
#   3. No updated dependency is on the HOLD list (framework and runtime packages).
#   4. The base branch enforces at least one required status check.
# Missing or malformed metadata means HOLD. On HOLD, any auto-merge already enabled is switched off.
# Arming is tied to the head SHA that was evaluated (--match-head-commit), so a newer push cannot ride along.
# Note: if every required check has already passed when this runs, GitHub merges at once.
# The guarantee is "only after required checks pass", not "never immediately".
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          UPDATES_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          # Minor releases of these have broken builds here before (React 19.3, 2026-09-28). A human decides.
          HOLD: "react react-dom next typescript tailwindcss framer-motion @supabase/supabase-js"
        run: |
          set -euo pipefail
          reasons=$(python3 - <<'PY'
          import json, os, re
          hold = set(os.environ["HOLD"].split())
          try:
              deps = json.loads(os.environ.get("UPDATES_JSON") or "")
          except ValueError:
              deps = None
          out = []
          if not isinstance(deps, list) or not deps:
              out.append("no dependency metadata")
          else:
              for d in deps:
                  name = (d or {}).get("dependencyName") or ""
                  prev = (d or {}).get("prevVersion") or ""
                  kind = (d or {}).get("updateType") or ""
                  m = re.match(r"^v?(\d+)\.\d+", prev)
                  if not name or not m:
                      out.append(f"incomplete metadata for '{name or '?'}'")
                  elif name in hold:
                      out.append(f"{name} is on the hold list")
                  elif kind == "version-update:semver-patch":
                      pass
                  elif kind == "version-update:semver-minor":
                      if m.group(1) == "0":
                          out.append(f"{name} {prev} is 0.x; a minor bump can break the API")
                  else:
                      out.append(f"{name}: update type '{kind or 'unknown'}' needs review")
          print("; ".join(out))
          PY
          )
          checks=$(gh api "repos/$REPO/branches/$BASE" --jq '(.protection.required_status_checks.contexts // []) | length') || checks=0
          level=$(gh api "repos/$REPO/branches/$BASE" --jq '.protection.required_status_checks.enforcement_level // "off"') || level=off
          if [[ "$checks" -eq 0 || "$level" == "off" ]]; then
            reasons="${reasons:+$reasons; }$BASE enforces no required checks, so auto-merge would merge at once"
          fi
          if [[ -z "$reasons" ]]; then verdict=arm; else verdict=hold; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "### Dependabot auto-merge: $verdict"
            echo "- required checks on $BASE: $checks ($level)"
            if [[ -n "$reasons" ]]; then echo "- held: $reasons"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict $reasons"

      - name: Arm auto-merge for the evaluated head (merges only after required checks pass)
        if: steps.decide.outputs.verdict == 'arm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR"

      - name: Hold means hold (switch off any auto-merge already enabled)
        if: steps.decide.outputs.verdict != 'arm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          if [[ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge --disable-auto "$PR"
          fi
