name: World access policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/world-policy-recursion.sql'
      - '.github/workflows/world-access-policy.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/world-policy-recursion.sql'
      - '.github/workflows/world-access-policy.yml'

permissions:
  contents: read

jobs:
  world-access-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reproduce recursion and verify every access boundary
        env:
          PGPASSWORD: local-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres --set ON_ERROR_STOP=1 -f supabase/tests/world-policy-recursion.sql
          psql -h 127.0.0.1 -U postgres -d postgres --set ON_ERROR_STOP=1 --set missing_membership=true -f supabase/tests/world-policy-recursion.sql
