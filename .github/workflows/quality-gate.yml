name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'

jobs:
  # ============================================
  # INSTALL — shared dependency install + cache
  # (mirrors ci.yml's install job so every downstream
  # job restores instead of re-running a full install)
  # ============================================
  install:
    name: Install
    # Cost gate: skip on draft PRs — agents iterate free; gate runs on
    # ready_for_review and on every push to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: quality-modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ============================================
  # TYPECHECK — allow failure, report error count
  # ============================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: quality-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: TypeScript Check (report only — via turbo for workspace-deps build)
        continue-on-error: true
        run: |
          pnpm turbo run type-check --filter=@arcanea/web 2>&1 | tee /tmp/tsc-output.txt || true
          ERROR_COUNT=$(grep -c "error TS" /tmp/tsc-output.txt || echo "0")
          echo "## TypeScript Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors found:** ${ERROR_COUNT}" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::warning::TypeScript has ${ERROR_COUNT} pre-existing errors"
            tail -20 /tmp/tsc-output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "- Zero errors — typecheck is clean" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # LINT
  # ============================================
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: quality-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm --dir apps/web run lint
        continue-on-error: true

  # ============================================
  # SECURITY — warn only
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: quality-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Security Audit (gate on high/critical)
        run: |
          # Single audit run; gate on high/critical, treat moderate/low as informational.
          pnpm audit --json > /tmp/audit.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            let v = { info:0, low:0, moderate:0, high:0, critical:0 };
            try { v = JSON.parse(fs.readFileSync("/tmp/audit.json","utf8")).metadata.vulnerabilities || v; } catch (e) {}
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const line = `## Security Audit\n\n| critical | high | moderate | low |\n|---|---|---|---|\n| ${v.critical} | ${v.high} | ${v.moderate} | ${v.low} |\n`;
            if (summary) fs.appendFileSync(summary, line);
            if (v.moderate + v.low > 0) {
              console.log(`::warning::${v.moderate} moderate / ${v.low} low severity advisories found — review pnpm audit output`);
            }
            if (v.high + v.critical > 0) {
              console.log(`::error::${v.high} high / ${v.critical} critical severity advisories found — must be resolved before merge`);
              process.exit(1);
            }
          '

  # ============================================
  # RELEASE INTEGRITY — no per-package publish workflows
  # (no install needed — pure filesystem check)
  # ============================================
  release-integrity:
    name: No Split-Brain Publish
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for forbidden per-package publish workflows
        run: |
          FOUND=$(find . -path "./.github/workflows/*" -prune -o -name "publish.yml" -path "*/.github/workflows/publish.yml" -print)
          if [ -n "$FOUND" ]; then
            echo "::error::Per-package publish.yml found — monorepo uses Changesets only."
            echo "Forbidden files:"
            echo "$FOUND"
            echo ""
            echo "Delete these and use 'pnpm changeset' instead."
            exit 1
          fi
          echo "Release integrity check passed — no split-brain publish workflows."

  # ============================================
  # BUILD VERIFICATION
  # ============================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [install, lint]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: quality-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        # Use turbo so workspace deps (@arcanea/design-system, @arcanea/publishing-house,
        # @starlight/multilingual) are built first via dependsOn ^build chain.
        # Plain `pnpm --filter @arcanea/web build` skips upstream deps and fails with
        # "Module not found: Can't resolve '@arcanea/design-system'".
        run: npx turbo run build --filter=@arcanea/web
        env:
          # Provide dummy env vars for build
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Build Summary
        if: success()
        run: |
          echo "## Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: Strict mode, 0 errors" >> $GITHUB_STEP_SUMMARY
          echo "- Build: Production ready" >> $GITHUB_STEP_SUMMARY

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
        continue-on-error: true

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [install, build]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: quality-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @arcanea/web exec playwright install --with-deps chromium

      - name: Build app for smoke test
        # Use turbo so workspace deps build first (see Production Build step above).
        run: npx turbo run build --filter=@arcanea/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Run E2E smoke
        run: cd apps/web && PLAYWRIGHT_NO_WEB_SERVER=1 npx playwright test --grep @smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

  # ============================================
  # STATUS CHECK FOR BRANCH PROTECTION
  # ============================================
  status:
    name: Quality Status
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, security, e2e-smoke, release-integrity]
    # always() so a real failure still reports, but skip entirely when the
    # suite itself was skipped (draft PR) — otherwise this shows a false
    # "Build failed" red X on every draft iteration.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Check Results
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeCheck | ${{ needs.typecheck.result }} (informational) |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} (warn only) |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Smoke | ${{ needs.e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY

          # Build MUST pass; lint is informational until ajv hoisting is resolved
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed — this is a blocking gate"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::warning::Lint failed (ajv hoisting issue) — non-blocking"
          fi
          echo "Quality gate passed (build green)"
