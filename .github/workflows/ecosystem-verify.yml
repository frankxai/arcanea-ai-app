name: Ecosystem Verify

on:
  pull_request:
    # ready_for_review re-fires the draft-gated job(s) below; without it a gated
    # job skips on the draft and never reports once the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".arcanea/config/repos.json"
      - ".arcanea/config/manifest.yaml"
      - "packages/*/package.json"
      - "apps/*/package.json"
      - "apps/web/lib/ecosystem/derived.ts"
      - "packages/orchestrator/src/ecosystem/**"

concurrency:
  group: ecosystem-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Cost gate: skip on draft PRs — agents iterate free; verification runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build orchestrator deps
        run: |
          pnpm --filter @arcanea/router-spec build
          pnpm --filter @arcanea/orchestrator build
      - name: Verify ecosystem derived.ts is in sync
        run: |
          if ! pnpm -F @arcanea/orchestrator ecosystem:verify; then
            echo "::error::derived.ts is out of sync! Showing diff:"
            git diff apps/web/lib/ecosystem/derived.ts
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
