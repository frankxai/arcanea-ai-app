name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/arcanea-design-preset.js'
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit block the workflow inherits the repo's read-only default
# token, so the sticky-comment step (if: always()) fails with "Resource not
# accessible by integration" and fails the whole job. Grant the minimal scopes:
# pull-requests:write to post the score comment, statuses/deployments:read for
# the Vercel-preview wait.
permissions:
  contents: read
  pull-requests: write
  statuses: read
  deployments: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for Vercel Preview
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 15
          environment: Preview

      - name: Audit with Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.vercel.outputs.url }}
            ${{ steps.vercel.outputs.url }}/pricing
            ${{ steps.vercel.outputs.url }}/chat
            ${{ steps.vercel.outputs.url }}/worlds
            ${{ steps.vercel.outputs.url }}/library
            ${{ steps.vercel.outputs.url }}/imagine
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment scores on PR
        if: always()
        continue-on-error: true # a cosmetic PR comment must never fail the gate
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse
          message: |
            ## Lighthouse scores (design-system + a11y gate)

            ${{ steps.lighthouse.outputs.manifest }}

            **Hard gates (fail PR):** accessibility ≥ 95, SEO ≥ 95, CLS ≤ 0.1
            _Soft gates (warn): performance ≥ 90, best-practices ≥ 95, TBT ≤ 300ms, LCP ≤ 2.5s_
