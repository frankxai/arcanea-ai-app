name: Facts Drift

# Advisory while the long tail of hardcoded numbers is wired to lib/facts.ts.
# The script exits 0 and prints findings; add --strict below to make it a
# hard gate once the tail is burned down.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/lib/facts.ts'

concurrency:
  group: facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts-drift:
    name: Hardcoded platform numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for hardcoded platform numbers
        run: node apps/web/scripts/check-facts-drift.mjs
