name: Facts Drift

# Hard gate: every platform number on a public surface must come from
# lib/facts.ts or lib/public-repo-registry.ts (or carry a facts-ok
# annotation). The long tail was burned down 2026-07-11.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/lib/facts.ts'

concurrency:
  group: facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts-drift:
    name: Hardcoded platform numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for hardcoded platform numbers
        run: node apps/web/scripts/check-facts-drift.mjs --strict
