name: Facts Drift

# Advisory while the long tail of hardcoded numbers is wired to lib/facts.ts.
# The script exits 0 and prints findings; add --strict below to make it a
# hard gate once the tail is burned down.
on:
  pull_request:
    branches: [main]
    # Every input the check reads. A PR that edits llms.txt or repos.json and
    # nothing else used to skip this job entirely, which is how the agent-facing
    # surfaces drifted furthest from lib/facts.ts.
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/lib/facts.ts'
      - 'apps/web/lib/luminors/config.ts'
      - 'apps/web/lib/content/loader.ts'
      - 'apps/web/lib/public-repo-registry.ts'
      - 'apps/web/messages/en.json'
      - 'apps/web/public/llms.txt'
      - 'apps/web/public/llms-full.txt'
      - 'apps/web/public/.well-known/ai-plugin.json'
      - 'apps/web/scripts/check-facts-drift.mjs'
      - '.arcanea/config/repos.json'
      - 'packages/arcanea-mcp/src/index.ts'
      - 'packages/arcanea-skills/skills/**'
      - '.github/workflows/facts-drift.yml'

concurrency:
  group: facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts-drift:
    name: Hardcoded platform numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for hardcoded platform numbers
        run: node apps/web/scripts/check-facts-drift.mjs
