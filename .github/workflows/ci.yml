      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Actual isolated login, document recovery and account isolation
        run: node scripts/run-project-document-service-fixture.mjs
      - name: Retain safe document acceptance evidence
        if: always()
