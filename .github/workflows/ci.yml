  author-independent-review:
    name: Independent author source review
    needs: [author-preview, world-preview]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.actor == 'frankxai' && (github.ref_name == 'agent/codex/author-draft-recovery-20261010' || github.ref_name == 'agent/codex/auth-response-privacy-20261010' || github.ref_name == 'agent/codex/mcp-runtime-integration-20261010' || github.ref_name == 'agent/codex/review-handover-20261010' || github.ref_name == 'agent/codex/world-creator-recovery-20261010' || github.ref_name == 'agent/codex/generation-admission-20261011' || github.ref_name == 'agent/codex/private-imagine-assets-20261011' || github.ref_name == 'agent/codex/project-document-recovery-20261011')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate pinned handover inputs before checkout
        if: github.ref_name == 'agent/codex/review-handover-20261010' && inputs.review_hub_release
        env:
          REVIEW_HUB_HEAD: ${{ inputs.review_hub_head }}
          REVIEW_HUB_BASE: ${{ inputs.review_hub_base }}
        run: |
          node --input-type=module -e 'for (const key of ["REVIEW_HUB_HEAD", "REVIEW_HUB_BASE"]) { if (!/^[a-f0-9]{40}$/.test(process.env[key] || "")) throw Error("Full pinned handover hashes required"); }'
      - name: Read the exact public release handover for independent review
        if: (github.ref_name == 'agent/codex/mcp-runtime-integration-20261010' || github.ref_name == 'agent/codex/review-handover-20261010') && inputs.review_hub_release
        uses: actions/checkout@v7
        with:
          repository: frankxai/agentic-ops-hub
          ref: ${{ github.ref_name == 'agent/codex/review-handover-20261010' && inputs.review_hub_head || '5326dc36c78f324ad7c47573d875c7b9689e8ecb' }}
          path: .review-hub
          fetch-depth: 2
          persist-credentials: false
      - name: Review the exact handover using the existing independent provider
        if: (github.ref_name == 'agent/codex/mcp-runtime-integration-20261010' || github.ref_name == 'agent/codex/review-handover-20261010') && inputs.review_hub_release
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_TARGET: hub-release
          REVIEW_HUB_HEAD: ${{ inputs.review_hub_head }}
          REVIEW_HUB_BASE: ${{ inputs.review_hub_base }}
        run: node scripts/review-author-recovery.mjs
      - name: Retain handover final findings and source receipt
        if: always() && (github.ref_name == 'agent/codex/mcp-runtime-integration-20261010' || github.ref_name == 'agent/codex/review-handover-20261010') && inputs.review_hub_release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hub-review-${{ github.ref_name == 'agent/codex/review-handover-20261010' && inputs.review_hub_head || '5326dc36c78f' }}-attempt-${{ github.run_attempt }}
          path: screenshots/hub-review/
          retention-days: 7
          if-no-files-found: warn
      - name: Review complete exact source using the existing independent provider
        if: (github.ref_name != 'agent/codex/review-handover-20261010' || !inputs.review_hub_release) && !(github.ref_name == 'agent/codex/world-creator-recovery-20261010' && inputs.world_live_generation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/review-author-recovery.mjs
      - name: Retain final findings and exact source receipt
        if: always() && (github.ref_name != 'agent/codex/review-handover-20261010' || !inputs.review_hub_release)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: author-review-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: screenshots/author-review/
          retention-days: 7
          if-no-files-found: warn

  generation-preview:
    name: Authenticated generation acceptance
    if: github.event_name == 'workflow_dispatch' && github.actor == 'frankxai' && github.ref_name == 'agent/codex/generation-admission-20261011'
    # This fixture compiles its own app with disposable Auth. Collect its evidence
    # even if a separate gallery suite fails; CI Status still requires both.
    needs: [install, lint, typecheck]
    runs-on: ubuntu-latest
