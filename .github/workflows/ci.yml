  private-imagine-preview:
    name: Authenticated private Imagine acceptance
    if: github.event_name == 'workflow_dispatch' && github.actor == 'frankxai' && github.ref_name == 'agent/codex/private-imagine-assets-20261011'
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Real isolated login, private save, reopen, recovery and export
        run: node scripts/run-provider-account-fixture.mjs
      - name: Retain safe private Imagine acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: private-imagine-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: screenshots/private-imagine/
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # STATUS — the merge gate. It is the only job here that cannot skip under any
  # event, so it is the only context whose green is unconditionally earned.
  # Gates on Install + Lint + TypeScript + Build. A restored cache can let a
  # downstream job pass after install fails, so install must be checked directly.
  # ============================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      [
        install,
        lint,
        typecheck,
        build,
        generation-preview,
        provider-account-preview,
        private-imagine-preview,
        project-document-preview,
        author-independent-review,
      ]
    # always() and nothing else: this job must run even when an upstream job fails
    # or is cancelled, so it reports a real verdict. Any condition that can make it
    # skip reads as a passing required check.
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Blocking |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Install | ${{ needs.install.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typecheck.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} | yes |" >> $GITHUB_STEP_SUMMARY

          PASS=true
          if [ "${{ needs.install.result }}" != "success" ]; then
            echo "::error::Install failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Lint failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::TypeScript failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed — blocks merge"
            PASS=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" = "agent/codex/generation-admission-20261011" ] && [ "${{ needs.generation-preview.result }}" != "success" ]; then
            echo "::error::Authenticated generation acceptance is unearned for this dispatched revision"
            PASS=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" = "agent/codex/private-imagine-assets-20261011" ] && [ "${{ needs.author-independent-review.result }}" != "success" ]; then
            echo "::error::Exact private Imagine source review is unearned for this dispatched revision"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" = "agent/codex/private-imagine-assets-20261011" ] && [ "${{ needs.private-imagine-preview.result }}" != "success" ]; then
            echo "::error::Authenticated private Imagine acceptance is unearned for this dispatched revision"
            PASS=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" = "agent/codex/provider-account-20261011" ] && [ "${{ needs.provider-account-preview.result }}" != "success" ]; then
            echo "::error::Authenticated provider settings acceptance is unearned for this dispatched revision"
            PASS=false
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" = "agent/codex/project-document-recovery-20261011" ]; then
            if [ "${{ needs.project-document-preview.result }}" != "success" ] || [ "${{ needs.author-independent-review.result }}" != "success" ]; then
              echo "::error::Document authenticated acceptance or exact-source review is unearned"
              PASS=false
            fi
          fi

          if [ "$PASS" = true ]; then
            echo "CI checks passed (install + lint + typecheck + build green); other release gates still apply"
          else
            exit 1
          fi
