name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 'edited' is required: it is the only pull_request activity type that fires
    # when the base branch is retargeted, and required-check verdicts are recorded
    # against the head SHA. Without it a green earned against one base survives a
    # retarget to another and gates a merge that was never verified.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "8.15.0"

jobs:
  # ============================================
  # INSTALL — shared dependency install step
  # ============================================
  install:
    name: Install
    # Unconditional. Build, Lint, TypeScript and CI Status are required contexts,
    # and GitHub treats a required
    # check whose conclusion is 'skipped' as satisfied -- measured 2026-09-03 on
    # frankxai/disruptivepassiveincome#4 (build=skipped, mergeStateStatus=CLEAN).
    # A draft condition here therefore does not hold an unverified PR back; it
    # publishes a green rollup that no job earned. This gate was removed once in
    # #252 and reintroduced by #293 as a cost control. Measured cost of the drafts
    # it suppresses: ~140 runs/month x ~14 billable minutes = ~1,960 min/month
    # (~$12 at $0.006/min) against this repo's 10,450 minutes in 2026-08.
    # Buy the verified merge; the concurrency block above already cancels
    # superseded draft iterations.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ============================================
  # LINT — fast feedback
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    # Runs even when install failed, so this required context fails instead of
    # skipping; a skipped required check is counted as satisfied. !cancelled()
    # rather than always() so cancel-in-progress still stops superseded runs.
    if: ${{ !cancelled() }}
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The formatter needs the PR base or previous push commit. Fetch
          # history inside checkout while its scoped token is available.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Reject npm usage in scripts
        run: |
          # Flag repo-level npm usage (not global installs, not comments/docs/shell utilities)
          HITS=$(grep -rn "^\s*npm install\|^\s*npm ci\|^\s*npm run" scripts/ .github/ 2>/dev/null | grep -v "npx\|node_modules\|.md\|pnpm\|echo\|#\|//\|log\.\|console\.\|npm install -g\|\.sh:" | head -5 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Found npm usage — use pnpm only (Execution Law)"
            exit 1
          fi
          echo "No npm usage found — pnpm discipline enforced"

      - name: Verify .nvmrc matches CI
        run: |
          if [ -f .nvmrc ]; then
            NVMRC_VER=$(cat .nvmrc | tr -d '[:space:]')
            if [ "$NVMRC_VER" != "${{ env.NODE_VERSION }}" ]; then
              echo "::error::.nvmrc ($NVMRC_VER) != CI Node (${{ env.NODE_VERSION }})"
              exit 1
            fi
          fi

      - name: Verify changed-file formatting failure handling
        run: node --test scripts/tests/changed-format.test.mjs

      - name: Verify visual-review trust and evidence boundaries
        run: node --test scripts/excellence-review.test.mjs

      - name: Verify preview deployment history handling
        run: node --test scripts/tests/vercel-ignore-build.test.mjs

      - name: Verify account return and public entry boundaries
        run: pnpm --dir apps/web exec tsx --test lib/worlds/__tests__/entry-access.test.ts

      - name: Verify library chapter slugs and hidden agent files
        run: pnpm --dir apps/web exec tsx --test lib/content/__tests__/loader-slugs.test.ts

      - name: ESLint
        run: pnpm --dir apps/web run lint

      # The repository has historical formatting debt. Enforce Prettier as a
      # ratchet on every file changed by this push/PR without masking failures
      # or forcing an unsafe whole-repository rewrite.
      - name: Prettier check (changed files)
        shell: bash
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/check-changed-format.sh "$FORMAT_BASE_SHA" "$GITHUB_SHA"

  # ============================================
  # TYPECHECK — blocking. Exits 1 on any TS error, and TypeScript is a required
  # context. (The previous comment here claimed the opposite.)
  # ============================================
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: install
    if: ${{ !cancelled() }}
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: TypeScript check (via turbo — builds workspace deps first)
        # Preserve Turbo's exit code directly, including crashes without an
        # "error TS" diagnostic. A log match is not a typecheck verdict.
        run: pnpm turbo run type-check --filter=@arcanea/web

  # ============================================
  # BUILD — production build verification
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [install, lint]
    if: ${{ !cancelled() }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build web app (via turbo — builds workspace deps first)
        run: pnpm turbo run build --filter=@arcanea/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Verify creator starter source, interactions and generated downloads
        run: |
          node --test packages/arcanea-creator-starters/scripts/build.test.mjs packages/arcanea-creator-starters/scripts/interactions.test.mjs
          node packages/arcanea-creator-starters/scripts/build.mjs --compat --check
          node scripts/build-creator-starters.mjs --check

      - name: Verify registry public-read boundary
        run: node --test scripts/tests/registry-public-read-contract.test.mjs

      - name: Verify Gemini key boundary for NFT scripts
        run: node --test scripts/tests/nft-gemini-key-contract.test.mjs

      - name: Verify World Context Gateway trust boundary
        run: |
          pnpm --dir apps/web exec eslint app/api/mcp/route.ts lib/mcp --max-warnings=0
          pnpm --dir packages/arcanea-mcp test:gateway
          pnpm --dir apps/web test:mcp-world-context

      - name: Verify Luminor public-read timeout
        run: pnpm test:luminor-read-timeout

      - name: Verify health and media readiness
        run: pnpm test:health-media-readiness

      - name: Verify Worlds accessibility boundary
        run: pnpm test:worlds-accessibility

      - name: Verify World detail read deadlines
        run: |
          node --test scripts/tests/world-detail-read-contract.test.mjs
          pnpm --filter @arcanea/web exec tsx --test lib/__tests__/async-deadline.test.ts

      - name: Verify saga public release boundary (default-deny)
        run: pnpm --dir apps/web test:saga-gate

      - name: Run package tests
        run: pnpm test:quick

      - name: Verify public collection assets and proposal relationships
        run: |
          node scripts/verify-sovereign-depths.mjs
          pnpm --dir apps/web exec tsx --test lib/visual-encyclopedia/sovereign-depths.test.ts
          node scripts/verify-weight-of-wonders.mjs
          pnpm --dir apps/web exec tsx --test lib/visual-encyclopedia/weight-of-wonders.test.ts

      - name: Verify galleries rendered desktop, 375px mobile and reduced motion
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web exec next start -p 3001 > "$RUNNER_TEMP/sovereign-next.log" 2>&1 &
          sovereign_server_pid=$!
          trap 'kill "$sovereign_server_pid" 2>/dev/null || true' EXIT
          # Collect both suites' evidence even if one fails; either failure blocks merge.
          gallery_status=0
          starter_status=0
          node scripts/capture-sovereign-built-app.cjs || gallery_status=$?
          node scripts/verify-creator-starters-browser.cjs || starter_status=$?
          if [ "$gallery_status" -ne 0 ] || [ "$starter_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload gallery rendered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: galleries-built-app-${{ github.sha }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm**: ${{ env.PNPM_VERSION }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # STATUS — the merge gate. It is the only job here that cannot skip under any
  # event, so it is the only context whose green is unconditionally earned.
  # Gates on Install + Lint + TypeScript + Build. A restored cache can let a
  # downstream job pass after install fails, so install must be checked directly.
  # ============================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [install, lint, typecheck, build]
    # always() and nothing else: this job must run even when an upstream job fails
    # or is cancelled, so it reports a real verdict. Any condition that can make it
    # skip reads as a passing required check.
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Blocking |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Install | ${{ needs.install.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typecheck.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} | yes |" >> $GITHUB_STEP_SUMMARY

          PASS=true
          if [ "${{ needs.install.result }}" != "success" ]; then
            echo "::error::Install failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Lint failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::TypeScript failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed — blocks merge"
            PASS=false
          fi

          if [ "$PASS" = true ]; then
            echo "CI checks passed (install + lint + typecheck + build green); other release gates still apply"
          else
            exit 1
          fi
