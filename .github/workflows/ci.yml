name: CI

on:
  workflow_dispatch:
    inputs:
      world_live_generation:
        description: Two bounded creator comparisons after exact-head review
        type: boolean
        default: false
      review_hub_release:
        description: Review the pinned public release handover
        type: boolean
        default: false
      review_hub_head:
        description: Full handover commit hash in the owned review lane
        type: string
        default: ""
      review_hub_base:
        description: Full first-parent hash of that handover commit
        type: string
        default: ""
  pull_request:
    # Validate stacked PRs too; each proposed merge needs its own checks.
    # 'edited' is required: it is the only pull_request activity type that fires
    # when the base branch is retargeted, and required-check verdicts are recorded
    # against the head SHA. Without it a green earned against one base survives a
    # retarget to another and gates a merge that was never verified.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.28.4"

jobs:
  # ============================================
  # INSTALL — shared dependency install step
  # ============================================
  install:
    name: Install
    # Unconditional. Build, Lint, TypeScript and CI Status are required contexts,
    # and GitHub treats a required
    # check whose conclusion is 'skipped' as satisfied -- measured 2026-09-03 on
    # frankxai/disruptivepassiveincome#4 (build=skipped, mergeStateStatus=CLEAN).
    # A draft condition here therefore does not hold an unverified PR back; it
    # publishes a green rollup that no job earned. This gate was removed once in
    # #252 and reintroduced by #293 as a cost control. Measured cost of the drafts
    # it suppresses: ~140 runs/month x ~14 billable minutes = ~1,960 min/month
    # (~$12 at $0.006/min) against this repo's 10,450 minutes in 2026-08.
    # Buy the verified merge; the concurrency block above already cancels
    # superseded draft iterations. Playwright in the Build job is a *step*
    # skip on drafts, not a job skip, so the required Build context still
    # earns turbo build + unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ============================================
  # LINT — fast feedback
  # ============================================
  lint:
    name: Lint
    services:
      author-db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-author-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-latest
    needs: install
    # Runs even when install failed, so this required context fails instead of
    # skipping; a skipped required check is counted as satisfied. !cancelled()
    # rather than always() so cancel-in-progress still stops superseded runs.
    if: ${{ !cancelled() }}
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The formatter needs the PR base or previous push commit. Fetch
          # history inside checkout while its scoped token is available.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Reject npm usage in scripts
        run: |
          # Flag repo-level npm usage (not global installs, not comments/docs/shell utilities)
          HITS=$(grep -rn "^\s*npm install\|^\s*npm ci\|^\s*npm run" scripts/ .github/ 2>/dev/null | grep -v "npx\|node_modules\|.md\|pnpm\|echo\|#\|//\|log\.\|console\.\|npm install -g\|\.sh:" | head -5 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Found npm usage — use pnpm only (Execution Law)"
            exit 1
          fi
          echo "No npm usage found — pnpm discipline enforced"

      - name: Verify .nvmrc matches CI
        run: |
          if [ -f .nvmrc ]; then
            NVMRC_VER=$(cat .nvmrc | tr -d '[:space:]')
            if [ "$NVMRC_VER" != "${{ env.NODE_VERSION }}" ]; then
              echo "::error::.nvmrc ($NVMRC_VER) != CI Node (${{ env.NODE_VERSION }})"
              exit 1
            fi
          fi

      - name: Verify changed-file formatting failure handling
        run: node --test scripts/tests/changed-format.test.mjs

      - name: Verify visual-review trust and evidence boundaries
        run: node --test scripts/excellence-review.test.mjs scripts/tests/visual-preview.test.mjs

      - name: Verify preview deployment history handling
        run: node --test scripts/tests/vercel-ignore-build.test.mjs

      - name: Verify independent review admission before provider access
        run: node --test scripts/test-independent-review-admission.mjs

      - name: Verify disposable generation provider isolation
        run: node --test scripts/tests/generation-fixture.test.mjs

      - name: Verify Luminor image handoff without inference or spending
        run: pnpm exec tsx --tsconfig apps/web/tsconfig.json --test apps/web/lib/luminors/tools/__tests__/image.test.ts

      - name: Verify auth recovery and creator economics
        run: node --test scripts/tests/auth-env.test.mjs scripts/tests/auth-redirect.test.mjs scripts/tests/creator-economics.test.mjs scripts/tests/provider-routing.test.mjs scripts/tests/provider-preferences.test.mjs scripts/tests/notification-channel.test.mjs

      - name: Verify public chat credentials and denial before provider execution
        run: pnpm --dir apps/web exec tsx --test --test-force-exit lib/gateway/__tests__/chat-route.test.ts

      - name: Verify generation admission, provider recovery and billing invariants
        run: pnpm --dir apps/web exec tsx --test lib/billing/__tests__/*.test.ts lib/imagine/__tests__/image-request.test.ts

      - name: Verify account favorites and private image recovery
        run: pnpm --dir apps/web exec tsx --test lib/imagine/__tests__/favorites.test.ts lib/imagine/__tests__/private-assets.test.ts lib/imagine/__tests__/hydration.test.ts

      - name: Verify customer voice credentials, privacy and recovery
        run: |
          pnpm --dir apps/web exec tsx --test --test-force-exit lib/voice/__tests__/voice-routes.test.ts lib/ai/__tests__/provider-preferences.test.ts
          node --test scripts/tests/provider-chat-instance.test.cjs scripts/tests/provider-fixture-private-config.test.cjs scripts/tests/private-imagine-blob-fixture.test.cjs

      - name: Verify author credentials and exact draft acknowledgements
        run: |
          pnpm --dir apps/web exec tsx --test --test-force-exit lib/author/__tests__/author-chat.test.ts lib/author/__tests__/draft-session.test.ts lib/author/__tests__/book-files.test.ts
          node --test scripts/tests/auth-response-privacy.test.cjs

      - name: Verify ingestion DNS, redirects and native proxy isolation
        run: |
          pnpm --dir apps/web test:safe-fetch
          node --test scripts/tests/safe-fetch-network.test.cjs
          node --test scripts/tests/studio-ingest-cache.test.cjs

      - name: Verify author draft ownership, persistence and migration recovery
        env:
          PGPASSWORD: disposable-author-fixture
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v original_first=0 -f supabase/tests/author-draft-recovery.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v original_first=1 -f supabase/tests/author-draft-recovery.sql

      - name: Verify atomic project document save and recovery
        env:
          PGPASSWORD: disposable-author-fixture
        run: |
          pnpm --dir apps/web exec tsx --test lib/docs/__tests__/save.test.ts
          pnpm --dir apps/web exec tsx lib/docs/__tests__/api-contracts.test.ts
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v doc_disposable=1 -v original_first=1 -f supabase/tests/project-doc-revisions.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v doc_disposable=1 -v original_first=0 -f supabase/tests/project-doc-revisions.sql

      - name: Verify document fixture private configuration ownership
        env:
          PROJECT_DOCUMENT_CONFIG_FIXTURE: "true"
        run: node --test scripts/tests/provider-fixture-private-config.test.cjs

      - name: Verify private document original recovery and portable export
        run: node --test scripts/tests/document-media.test.cjs scripts/tests/document-media-client.test.cjs scripts/tests/document-media-blob-fixture.test.cjs

      - name: Verify private image owner access and atomic storage admission
        env:
          PGPASSWORD: disposable-author-fixture
        run: |
          createdb -h localhost -U postgres arcanea_private_imagine_fixture
          psql -h localhost -U postgres -d arcanea_private_imagine_fixture -v ON_ERROR_STOP=1 -f supabase/tests/private-imagine-assets.sql
          psql -h localhost -U postgres -d arcanea_private_imagine_fixture -v ON_ERROR_STOP=1 -f supabase/tests/project-doc-media.sql

      - name: Verify prompt-books first HTML is the landing
        run: node --test scripts/tests/prompt-books-first-html-contract.test.mjs

      - name: Verify Prompt Books save recovery and actor isolation
        run: pnpm --dir apps/web exec tsx --test lib/prompt-books/__tests__/recovery.test.ts lib/prompt-books/__tests__/lifecycle.test.ts lib/prompt-books/__tests__/templates.test.ts lib/prompt-books/__tests__/conflicts.test.ts lib/prompt-books/__tests__/tag-ordering.test.ts lib/prompt-books/__tests__/search-recovery.test.ts

      - name: Verify exact world drafts and account return paths
        run: |
          pnpm --dir apps/web exec tsx --test lib/worlds/__tests__/draft.test.ts lib/worlds/__tests__/entry-access.test.ts
          node --test scripts/test-world-generation.cjs scripts/test-world-save.cjs scripts/test-world-elements.cjs scripts/test-world-live-admission.mjs

      - name: Verify feedback persistence receipts
        run: pnpm --dir apps/web exec tsx --test --test-force-exit lib/feedback/__tests__/route.test.ts

      - name: Verify billing admission and operation recovery
        run: pnpm --dir apps/web test:billing

      - name: Verify waitlist signups are saved or honestly refused
        run: pnpm --dir apps/web exec tsx --test lib/waitlist/__tests__/join.test.ts lib/waitlist/__tests__/submit.test.ts

      - name: Verify library chapter slugs and hidden agent files
        run: pnpm --dir apps/web exec tsx --test lib/content/__tests__/loader-slugs.test.ts

      - name: Verify reader title presentation and unchanged scene source
        run: node --test scripts/tests/reader-presentation.test.cjs

      - name: ESLint
        run: pnpm --dir apps/web run lint

      - name: Gate dependencies on high and critical advisories
        run: pnpm audit --audit-level=high

      # The repository has historical formatting debt. Enforce Prettier as a
      # ratchet on every file changed by this push/PR without masking failures
      # or forcing an unsafe whole-repository rewrite.
      - name: Prettier check (changed files)
        shell: bash
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$FORMAT_BASE_SHA" ]; then
            FORMAT_BASE_SHA=$(git merge-base origin/main "$GITHUB_SHA")
          fi
          bash scripts/check-changed-format.sh "$FORMAT_BASE_SHA" "$GITHUB_SHA"

  # ============================================
  # TYPECHECK — blocking. Exits 1 on any TS error, and TypeScript is a required
  # context. (The previous comment here claimed the opposite.)
  # ============================================
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: install
    if: ${{ !cancelled() }}
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: TypeScript check (via turbo — builds workspace deps first)
        # Preserve Turbo's exit code directly, including crashes without an
        # "error TS" diagnostic. A log match is not a typecheck verdict.
        run: pnpm turbo run type-check --filter=@arcanea/web

  # ============================================
  # BUILD — production build verification
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [install, lint]
    if: ${{ !cancelled() }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build web app (via turbo — builds workspace deps first)
        run: pnpm turbo run build --filter=@arcanea/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Verify creator starter source, interactions and generated downloads
        run: |
          node --test packages/arcanea-creator-starters/scripts/build.test.mjs packages/arcanea-creator-starters/scripts/interactions.test.mjs
          node packages/arcanea-creator-starters/scripts/build.mjs --compat --check
          node scripts/build-creator-starters.mjs --check

      - name: Verify registry public-read boundary
        run: node --test scripts/tests/registry-public-read-contract.test.mjs

      - name: Verify Gemini key boundary for NFT scripts
        run: node --test scripts/tests/nft-gemini-key-contract.test.mjs

      - name: Verify World Context Gateway trust boundary
        run: |
          pnpm --dir apps/web exec eslint app/api/mcp/route.ts lib/mcp --max-warnings=0
          pnpm --dir packages/arcanea-mcp test:gateway
          pnpm --dir apps/web test:mcp-world-context

      - name: Verify MCP runtime and installed consumer package
        run: |
          pnpm --dir packages/arcanea-mcp test:delivery
          pnpm --dir packages/arcanea-mcp test:consumer
      - name: Retain MCP consumer delivery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mcp-consumer-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: screenshots/mcp-consumer/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify Luminor public-read timeout
        run: pnpm test:luminor-read-timeout

      - name: Verify health and media readiness
        run: pnpm test:health-media-readiness

      - name: Verify Arcanea API operator and local guidance contracts
        run: pnpm --dir apps/web exec tsx --test lib/media/__tests__/operator-role.test.ts lib/apl/__tests__/local-guidance.test.ts

      - name: Verify saved media URL contracts
        run: pnpm --dir apps/web exec tsx --test lib/media/__tests__/creation-url.test.ts lib/media/__tests__/creation-media-route.test.ts lib/media/__tests__/creation-upload-route.test.ts

      - name: Verify Worlds accessibility boundary
        run: pnpm test:worlds-accessibility

      - name: Verify Guardian reports use RLS reads without service role
        run: node --test scripts/tests/guardian-report-read.test.mjs

      - name: Verify World detail read deadlines
        run: |
          node --experimental-strip-types --test scripts/tests/world-detail-read-contract.test.mjs scripts/tests/world-read-result.test.mjs
          pnpm --filter @arcanea/web exec tsx --test lib/__tests__/async-deadline.test.ts

      - name: Verify saga public release boundary (default-deny)
        run: pnpm --dir apps/web test:saga-gate

      - name: Verify catalog entries match reader chapters
        run: |
          pnpm --dir apps/web exec tsx lib/saga/__tests__/chapter-files.test.ts
          pnpm --dir apps/web exec tsx --test lib/saga/__tests__/series-entry.test.ts

      - name: Run package tests
        run: pnpm test:quick

      - name: Verify model routing and native CLI adapters
        timeout-minutes: 2
        run: |
          pnpm --dir packages/router-spec build
          pnpm --dir packages/router-spec validate
          pnpm --dir packages/orchestrator build
          pnpm exec tsx --test --test-concurrency=1 packages/router-spec/tests/validate.test.ts packages/orchestrator/tests/*.test.ts packages/orchestrator/tests/ecosystem/*.test.ts

      - name: Verify proposed quest fixture replay and refusal
        run: node docs/research/benchmarks/quest-authoring-proof-2026-10-02/replay-check.mjs


      - name: Verify public collection assets and proposal relationships
        run: |
          node scripts/verify-sovereign-depths.mjs
          pnpm --dir apps/web exec tsx --test lib/visual-encyclopedia/sovereign-depths.test.ts
          node scripts/verify-weight-of-wonders.mjs
          pnpm --dir apps/web exec tsx --test lib/visual-encyclopedia/weight-of-wonders.test.ts

      - name: Verify shop checkout trust boundaries
        run: pnpm --dir apps/web exec tsx --test lib/shop/__tests__/checkout.test.ts

      - name: Verify reader catalog and featured chapter journeys
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web exec next start -p 3001 > "$RUNNER_TEMP/reader-next.log" 2>&1 &
          reader_server_pid=$!
          trap 'kill "$reader_server_pid" 2>/dev/null || true' EXIT
          node scripts/verify-reader-entry-browser.cjs

      - name: Upload reader journey evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reader-entry-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: screenshots/reader-entry/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify community signup and recovery in the built browser
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web exec next start -p 3001 > "$RUNNER_TEMP/community-next.log" 2>&1 &
          community_server_pid=$!
          trap 'kill "$community_server_pid" 2>/dev/null || true' EXIT
          node scripts/verify-community-capture-browser.cjs

      - name: Upload community signup browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: community-capture-built-app-${{ github.sha }}
          path: screenshots/community-capture/
          retention-days: 7
          if-no-files-found: warn

      - name: Select footer browser scope
        id: footer-scope
        run: |
          git rev-parse --verify HEAD^ > /dev/null
          footer_changed=0
          git diff --quiet HEAD^ HEAD -- apps/web/components/navigation/footer.tsx apps/web/lib/waitlist apps/web/app/api/subscribe/route.ts apps/web/app/layout.tsx apps/web/app/globals.css packages/design-system/src/tokens.css scripts/verify-footer-built-app.cjs .github/workflows/ci.yml || footer_changed=$?
          if [ "$footer_changed" -gt 1 ]; then exit "$footer_changed"; fi
          if [ "$footer_changed" -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify built-app browser journeys
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || steps.footer-scope.outputs.run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          FOOTER_BROWSER: ${{ steps.footer-scope.outputs.run }}
          RUN_GALLERY_BROWSER: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web exec next start -p 3001 > "$RUNNER_TEMP/sovereign-next.log" 2>&1 &
          sovereign_server_pid=$!
          trap 'kill "$sovereign_server_pid" 2>/dev/null || true' EXIT
          # Collect both suites' evidence even if one fails; either failure blocks merge.
          gallery_status=0
          starter_status=0
          draft_status=0
          shop_status=0
          chat_tools_status=0
          voice_credentials_status=0
          prompt_books_status=0
          footer_status=0
          if [ "$RUN_GALLERY_BROWSER" = "true" ]; then
            node scripts/capture-sovereign-built-app.cjs || gallery_status=$?
            node scripts/verify-creator-starters-browser.cjs || starter_status=$?
            node scripts/verify-world-draft-browser.cjs || draft_status=$?
            node scripts/verify-shop-browser.cjs || shop_status=$?
            timeout 120s node scripts/verify-chat-tools-browser.cjs || chat_tools_status=$?
            timeout 120s node scripts/verify-voice-credentials-browser.cjs || voice_credentials_status=$?
            PLAYWRIGHT_NO_WEB_SERVER=1 pnpm --dir apps/web exec playwright test e2e/prompt-books-recovery.spec.ts || prompt_books_status=$?
          fi
          if [ "$FOOTER_BROWSER" = "true" ]; then
            node scripts/verify-footer-built-app.cjs || footer_status=$?
          fi
          if [ "$gallery_status" -ne 0 ] || [ "$starter_status" -ne 0 ] || [ "$draft_status" -ne 0 ] || [ "$shop_status" -ne 0 ] || [ "$chat_tools_status" -ne 0 ] || [ "$voice_credentials_status" -ne 0 ] || [ "$prompt_books_status" -ne 0 ] || [ "$footer_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload gallery rendered evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || steps.footer-scope.outputs.run == 'true')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: galleries-built-app-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm**: ${{ env.PNPM_VERSION }}" >> $GITHUB_STEP_SUMMARY

  # Authenticated author acceptance runs on the exact owned preview with real
  # fixture accounts, separately from unauthenticated compiled-gallery fixtures.
  author-preview:
    name: Authenticated author preview
    if: github.event_name == 'workflow_dispatch' && github.actor == 'frankxai' && github.ref_name == 'agent/codex/author-draft-recovery-20261010'
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Verify real authenticated owner recovery and account isolation
        env:
          AUTHOR_PREVIEW_FIXTURE: ${{ secrets.ARCANEA_AUTHOR_PREVIEW_FIXTURE_20261010 }}
          AUTHOR_EXPECTED_HEAD: ${{ github.sha }}
          AUTHOR_TEST_CONFIG: ${{ runner.temp }}/author-fixture.json
        run: |
          node -e 'const fs=require("node:fs");const c=JSON.parse(process.env.AUTHOR_PREVIEW_FIXTURE);if(c.head!==process.env.AUTHOR_EXPECTED_HEAD)throw Error("Preview fixture is bound to a different source revision");for(const a of c.accounts)console.log("::add-mask::"+a.password);console.log("::add-mask::"+c.shareUrl);c.output="screenshots/author-hosted";fs.writeFileSync(process.env.AUTHOR_TEST_CONFIG,JSON.stringify(c),{mode:0o600});'
          trap 'rm -f "$AUTHOR_TEST_CONFIG"' EXIT
          pnpm --dir apps/web exec playwright install --with-deps chromium
          timeout 300s node scripts/verify-author-draft-browser.cjs
      - name: Retain authenticated preview evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: author-preview-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: screenshots/author-hosted/
          retention-days: 7
          if-no-files-found: warn

  world-preview:
    name: Authenticated world acceptance
    if: github.event_name == 'workflow_dispatch' && github.actor == 'frankxai' && github.ref_name == 'agent/codex/world-creator-recovery-20261010'
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
