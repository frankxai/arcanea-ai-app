name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'

jobs:
  # ============================================
  # INSTALL — shared dependency install step
  # ============================================
  install:
    name: Install
    # Draft iterations are intentionally free. The ready_for_review event is
    # included above, so the required Build context executes before merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ============================================
  # LINT — fast feedback
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Reject npm usage in scripts
        run: |
          # Flag repo-level npm usage (not global installs, not comments/docs/shell utilities)
          HITS=$(grep -rn "^\s*npm install\|^\s*npm ci\|^\s*npm run" scripts/ .github/ 2>/dev/null | grep -v "npx\|node_modules\|.md\|pnpm\|echo\|#\|//\|log\.\|console\.\|npm install -g\|\.sh:" | head -5 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Found npm usage — use pnpm only (Execution Law)"
            exit 1
          fi
          echo "No npm usage found — pnpm discipline enforced"

      - name: Verify .nvmrc matches CI
        run: |
          if [ -f .nvmrc ]; then
            NVMRC_VER=$(cat .nvmrc | tr -d '[:space:]')
            if [ "$NVMRC_VER" != "${{ env.NODE_VERSION }}" ]; then
              echo "::error::.nvmrc ($NVMRC_VER) != CI Node (${{ env.NODE_VERSION }})"
              exit 1
            fi
          fi

      - name: ESLint
        run: pnpm --dir apps/web run lint
        continue-on-error: true

      - name: Prettier check
        run: pnpm format:check
        continue-on-error: true

  # ============================================
  # TYPECHECK — informational, does not block merge
  # Reports error count but never fails the job.
  # Once errors hit 0, flip continue-on-error to false.
  # ============================================
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: TypeScript check (via turbo — builds workspace deps first)
        run: |
          pnpm turbo run type-check --filter=@arcanea/web 2>&1 | tee /tmp/tsc-output.txt
          ERROR_COUNT=$(grep -c "error TS" /tmp/tsc-output.txt || echo "0")
          echo "## TypeScript Report" >> $GITHUB_STEP_SUMMARY
          echo "**Errors**: ${ERROR_COUNT}" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::TypeScript has ${ERROR_COUNT} errors"
            exit 1
          fi

  # ============================================
  # BUILD — production build verification
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [install, lint]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build web app (via turbo — builds workspace deps first)
        run: pnpm turbo run build --filter=@arcanea/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Verify registry public-read boundary
        run: node --test scripts/tests/registry-public-read-contract.test.mjs

      - name: Verify Gemini key boundary for NFT scripts
        run: node --test scripts/tests/nft-gemini-key-contract.test.mjs

      - name: Verify World Context Gateway trust boundary
        run: |
          pnpm --dir apps/web exec eslint app/api/mcp/route.ts lib/mcp --max-warnings=0
          pnpm --dir packages/arcanea-mcp test:gateway
          pnpm --dir apps/web test:mcp-world-context

      - name: Verify Luminor public-read timeout
        run: pnpm test:luminor-read-timeout

      - name: Verify Worlds accessibility boundary
        run: node --test scripts/tests/worlds-accessibility-contract.test.mjs

      - name: Run package tests
        run: pnpm test:quick
        continue-on-error: true

      - name: Build summary
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm**: ${{ env.PNPM_VERSION }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # STATUS — merge gate (green = safe to ship)
  # Gates on Install + Lint + TypeScript + Build.
  # TypeScript is now blocking — apps/web tsc --noEmit exits 0.
  # ============================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    # Do not publish a false failure for intentionally skipped draft suites.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Blocking |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typecheck.result }} | yes |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} | yes |" >> $GITHUB_STEP_SUMMARY

          PASS=true
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Lint failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "::error::TypeScript failed — blocks merge"
            PASS=false
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed — blocks merge"
            PASS=false
          fi

          if [ "$PASS" = true ]; then
            echo "CI passed — safe to merge (lint + typecheck + build green)"
          else
            exit 1
          fi
