name: Canon Lint

on:
  pull_request:
    branches: [main]
    # Deliberately unfiltered. The conflict-marker job below scans every tracked
    # file, and a path filter would defeat it — unresolved markers land in files
    # nobody was editing (16 shipped this way on 2026-08-08). The canon-lint job
    # keeps its own book/.arcanea/content filter via changed-files and no-ops on
    # PRs that touch nothing canonical.

concurrency:
  group: canon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflict-markers:
    name: Merge Conflict Marker Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect unresolved merge conflict markers
        run: |
          echo "## Conflict Marker Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          WARNINGS=0

          # Git writes markers as EXACTLY seven characters at column 0, optionally
          # followed by a space and a branch/commit label. Anchoring on exactly seven
          # plus space-or-end-of-line keeps nested blockquotes and long rules out.
          # A bare seven-equals line is intentionally NOT in this pattern: it is
          # indistinguishable from a setext heading underline. It is escalated to an
          # error only inside a file that already carries a real marker (below).
          MARKER_RE='^(<{7}|\|{7}|>{7})( .*)?$'
          SEPARATOR_RE='^={7}$'

          MARKER_HITS=$(git grep -I -n -E "$MARKER_RE" -- . || true)
          SEPARATOR_HITS=$(git grep -I -n -E "$SEPARATOR_RE" -- . || true)

          CONFLICTED_FILES=""
          if [ -n "$MARKER_HITS" ]; then
            CONFLICTED_FILES=$(printf '%s\n' "$MARKER_HITS" | cut -d: -f1 | sort -u)
            while IFS= read -r hit; do
              HIT_FILE=$(echo "$hit" | cut -d: -f1)
              HIT_LINE=$(echo "$hit" | cut -d: -f2)
              echo "::error file=${HIT_FILE},line=${HIT_LINE}::Unresolved merge conflict marker. Finish the merge before pushing — never commit a '<<<<<<<', '=======' or '>>>>>>>' line."
              echo "- \`${HIT_FILE}\`:${HIT_LINE} — conflict marker" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            done <<< "$MARKER_HITS"
          fi

          if [ -n "$SEPARATOR_HITS" ]; then
            while IFS= read -r hit; do
              HIT_FILE=$(echo "$hit" | cut -d: -f1)
              HIT_LINE=$(echo "$hit" | cut -d: -f2)
              if [ -n "$CONFLICTED_FILES" ] && printf '%s\n' "$CONFLICTED_FILES" | grep -Fxq "$HIT_FILE"; then
                echo "::error file=${HIT_FILE},line=${HIT_LINE}::Conflict separator in a file that already carries merge markers — this is the '=======' divider, not a heading underline."
                echo "- \`${HIT_FILE}\`:${HIT_LINE} — conflict separator" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              else
                echo "::warning file=${HIT_FILE},line=${HIT_LINE}::Seven-equals line — a setext heading underline here, but the same shape as an orphaned conflict separator. Confirm it is intentional."
                WARNINGS=$((WARNINGS + 1))
              fi
            done <<< "$SEPARATOR_HITS"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors**: ${ERRORS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings**: ${WARNINGS}" >> $GITHUB_STEP_SUMMARY

          if [ $ERRORS -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Conflict markers MUST be resolved before merge." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "No unresolved conflict markers in tracked files."

  canon-lint:
    name: Canon Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            book/**
            .arcanea/lore/**
            apps/web/content/**

      - name: Validate Guardian names
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "## Canon Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          WARNINGS=0

          # Canonical Guardian/God/Goddess names from CANON_LOCKED.md
          # Gate order: Foundation, Flow, Fire, Heart, Voice, Sight, Crown, Starweave, Unity, Source
          CANONICAL_GODS="Lyssandria|Leyla|Draconia|Maylinn|Alera|Lyria|Aiyami|Elara|Ino|Shinkami"
          CANONICAL_GODBEASTS="Kaelith|Veloura|Draconis|Laeylinn|Otome|Yumiko|Sol|Vaelith|Kyuro|Source"
          CANONICAL_GATES="Foundation|Flow|Fire|Heart|Voice|Sight|Crown|Starweave|Unity|Source"
          CANONICAL_ELEMENTS="Fire|Water|Earth|Wind|Void|Spirit"
          CANONICAL_HOUSES="Lumina|Nero|Pyros|Aqualis|Terra|Ventus|Synthesis"

          echo "### Checking changed files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for file in ${{ steps.changed.outputs.all_changed_files }}; do
            if [[ ! -f "$file" ]]; then
              continue
            fi

            FILE_ERRORS=0
            FILE_WARNINGS=0

            # --------------------------------------------------
            # CHECK 1: Hz frequencies in user-facing content
            # Hz values are backend-only, never user-facing
            # --------------------------------------------------
            HZ_MATCHES=$(grep -n "[0-9]\+\s*Hz" "$file" 2>/dev/null || true)
            if [ -n "$HZ_MATCHES" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d: -f1)
                echo "::warning file=${file},line=${LINE_NUM}::Hz frequency found — Hz values are backend-only, use poetic taglines instead"
                FILE_WARNINGS=$((FILE_WARNINGS + 1))
              done <<< "$HZ_MATCHES"
            fi

            # --------------------------------------------------
            # CHECK 2: Anti-slop patterns
            # --------------------------------------------------
            SLOP_PATTERNS="(?i)\bdelve\b|\btapestry of\b|\bin the realm of\b|\bit.s important to note\b|\bunleash\b|\bgame.changer\b|\bparadigm shift\b"
            SLOP_MATCHES=$(grep -Pn "$SLOP_PATTERNS" "$file" 2>/dev/null || true)
            if [ -n "$SLOP_MATCHES" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d: -f1)
                CONTENT=$(echo "$line" | cut -d: -f2-)
                echo "::warning file=${file},line=${LINE_NUM}::Anti-slop: overused AI phrase detected — '${CONTENT:0:80}'"
                FILE_WARNINGS=$((FILE_WARNINGS + 1))
              done <<< "$SLOP_MATCHES"
            fi

            # --------------------------------------------------
            # CHECK 3: Nero is NOT evil
            # --------------------------------------------------
            NERO_EVIL=$(grep -Pin "\bNero\b.{0,30}\b(evil|villain|wicked|malevolent)\b" "$file" 2>/dev/null || true)
            if [ -n "$NERO_EVIL" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d: -f1)
                echo "::error file=${file},line=${LINE_NUM}::Canon violation: Nero is NOT evil. Nero is the Primordial Darkness, the Fertile Unknown. Shadow is corrupted Void."
                FILE_ERRORS=$((FILE_ERRORS + 1))
              done <<< "$NERO_EVIL"
            fi

            # --------------------------------------------------
            # CHECK 4: Malachar title check
            # --------------------------------------------------
            MALACHAR_WRONG=$(grep -Pin "\bMalachar\b" "$file" 2>/dev/null | grep -Piv "(Dark Lord|Lumenbright|First Eldrian|Shadowfen|sealed)" || true)
            if [ -n "$MALACHAR_WRONG" ]; then
              # This is informational — Malachar can appear in context
              # Only warn if called something other than Dark Lord
              MALACHAR_TITLE=$(grep -Pin "\bMalachar\b.{0,20}\b(the evil|evil lord|shadow king)\b" "$file" 2>/dev/null || true)
              if [ -n "$MALACHAR_TITLE" ]; then
                while IFS= read -r line; do
                  LINE_NUM=$(echo "$line" | cut -d: -f1)
                  echo "::warning file=${file},line=${LINE_NUM}::Malachar's canonical title is 'the Dark Lord', not other variants"
                  FILE_WARNINGS=$((FILE_WARNINGS + 1))
                done <<< "$MALACHAR_TITLE"
              fi
            fi

            # --------------------------------------------------
            # CHECK 5: Gate misspellings / wrong names
            # --------------------------------------------------
            # Check for "Star Weave" (should be "Starweave") or other common errors
            GATE_TYPOS=$(grep -Pin "\bStar Weave\b|\bStar-weave\b|\bstar weave\b" "$file" 2>/dev/null || true)
            if [ -n "$GATE_TYPOS" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d: -f1)
                echo "::error file=${file},line=${LINE_NUM}::Canon: 'Starweave' is one word, no hyphen"
                FILE_ERRORS=$((FILE_ERRORS + 1))
              done <<< "$GATE_TYPOS"
            fi

            # --------------------------------------------------
            # CHECK 6: Element count — must be five, not four or six
            # --------------------------------------------------
            FOUR_ELEMENTS=$(grep -Pin "\bfour elements\b" "$file" 2>/dev/null || true)
            if [ -n "$FOUR_ELEMENTS" ]; then
              while IFS= read -r line; do
                LINE_NUM=$(echo "$line" | cut -d: -f1)
                echo "::error file=${file},line=${LINE_NUM}::Canon: Arcanea has FIVE elements (Fire, Water, Earth, Wind, Void/Spirit), not four"
                FILE_ERRORS=$((FILE_ERRORS + 1))
              done <<< "$FOUR_ELEMENTS"
            fi

            ERRORS=$((ERRORS + FILE_ERRORS))
            WARNINGS=$((WARNINGS + FILE_WARNINGS))

            if [ $FILE_ERRORS -gt 0 ] || [ $FILE_WARNINGS -gt 0 ]; then
              echo "- \`${file}\`: ${FILE_ERRORS} errors, ${FILE_WARNINGS} warnings" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors**: ${ERRORS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings**: ${WARNINGS}" >> $GITHUB_STEP_SUMMARY

          if [ $ERRORS -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Canon errors MUST be fixed before merge." >> $GITHUB_STEP_SUMMARY
            echo "Reference: .arcanea/lore/CANON_LOCKED.md" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ $WARNINGS -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Warnings are advisory. Review and fix if appropriate." >> $GITHUB_STEP_SUMMARY
          fi

          echo "Canon lint complete."
