name: Restore from incident

# One-click recovery of files deleted in a prior commit.
# Opens a PR with the restored content for review.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to restore FROM (e.g. 073bc640^ for parent of mass-revert)'
        required: true
        type: string
      path_glob:
        description: 'Path glob to restore (e.g. .claude/commands/** or book/lore/)'
        required: true
        type: string
      branch_suffix:
        description: 'Suffix for the restore branch'
        required: true
        default: 'recovery'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve target commit
        id: resolve
        run: |
          SHA="${{ inputs.commit_sha }}"
          RESOLVED=$(git rev-parse "$SHA")
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "short=${RESOLVED:0:8}" >> "$GITHUB_OUTPUT"

      - name: List restorable files
        id: list
        run: |
          SHA="${{ steps.resolve.outputs.resolved }}"
          GLOB="${{ inputs.path_glob }}"
          # Normalize glob for ls-tree (strip trailing /** and /)
          NORM=$(echo "$GLOB" | sed 's|/\*\*$||' | sed 's|/$||')

          git ls-tree -r --name-only "$SHA" -- "$NORM" > /tmp/files.txt || true
          COUNT=$(wc -l < /tmp/files.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "✗ No files found at $SHA under $GLOB"
            exit 1
          fi
          echo "Found $COUNT files to restore."
          head -20 /tmp/files.txt

      - name: Create restore branch
        run: |
          BRANCH="restore/${{ inputs.branch_suffix }}-${{ steps.resolve.outputs.short }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Restore files
        run: |
          SHA="${{ steps.resolve.outputs.resolved }}"
          NORM=$(echo "${{ inputs.path_glob }}" | sed 's|/\*\*$||' | sed 's|/$||')
          git checkout "$SHA" -- "$NORM"
          git status --short | head -30

      - name: Commit restoration
        run: |
          git config user.name  "arcanea-guardian-bot"
          git config user.email "guardian@arcanea.ai"
          git add -A

          COUNT="${{ steps.list.outputs.count }}"
          SHA="${{ steps.resolve.outputs.short }}"
          GLOB="${{ inputs.path_glob }}"

          git commit -m "restore: bring back $COUNT files from $SHA (glob: $GLOB)

          Automated restoration via workflow_dispatch.
          Source commit: ${{ steps.resolve.outputs.resolved }}
          Triggered by: ${{ github.actor }}

          BIG-CHANGE: restoration of $COUNT historical files"

      - name: Push branch
        run: git push -u origin "$BRANCH"

      - name: Open PR
        uses: actions/github-script@v9
        with:
          script: |
            const branch = process.env.BRANCH;
            const count = '${{ steps.list.outputs.count }}';
            const sha = '${{ steps.resolve.outputs.short }}';
            const glob = '${{ inputs.path_glob }}';
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'main',
              title: `restore: ${count} files from ${sha} (${glob})`,
              body: [
                `## Automated restoration`,
                ``,
                `- **Source commit:** \`${sha}\``,
                `- **Path glob:** \`${glob}\``,
                `- **Files restored:** ${count}`,
                `- **Triggered by:** @${context.actor}`,
                ``,
                `Review the restored files, then merge when satisfied.`,
                ``,
                `_Generated by \`.github/workflows/restore-from-incident.yml\`_`
              ].join('\n')
            });
            core.notice(`PR opened: ${pr.html_url}`);
