name: Visual QA - Screenshot + Gemini Vision Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - 'packages/arcanea-design-preset.js'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Vercel preview URL to audit (optional override)'
        required: false

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: read
  deployments: read

jobs:
  visual-qa:
    # Cost gate: skip on draft PRs — agents iterate free; QA runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Wait for Vercel preview deployment
        id: wait-vercel
        if: ${{ inputs.preview_url == '' || inputs.preview_url == null }}
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 240
        continue-on-error: true

      - name: Resolve preview URL
        id: resolve-url
        uses: actions/github-script@v7
        with:
          script: |
            let previewUrl = '${{ inputs.preview_url }}' || '${{ steps.wait-vercel.outputs.url }}';
            // Commit-status target_url points at the Vercel deployment INSPECTOR page (needs
            // Vercel auth), not the live *.vercel.app site — confirmed by an actual failed run
            // (Playwright/Gemini got a 404/auth wall). The reliable source for the real live
            // URL is vercel[bot]'s own PR comment table, which we've observed to always render
            // as: | [arcanea-ai-app](...) | ![Ready](...) [Ready](...) | [Preview](LIVE_URL), ...
            // Match the exact project row (excluding the sibling arcanea-ai-appx row) and only
            // accept it once that row shows the Ready icon.
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            for (let attempt = 0; !previewUrl && attempt < 20; attempt++) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const vercelComment = comments.find(c => c.body.startsWith('[vc]:'));
              if (vercelComment) {
                const row = vercelComment.body
                  .split('\n')
                  .find(l => l.includes('| [arcanea-ai-app](') && !l.includes('arcanea-ai-appx'));
                if (row) {
                  const isReady = /!\[Ready\]/.test(row);
                  const previewMatch = row.match(/\[Preview\]\((https:\/\/[^)]+)\)/);
                  core.info(`Attempt ${attempt + 1}/20: arcanea-ai-app row ready=${isReady} preview=${previewMatch ? previewMatch[1] : 'none'}`);
                  if (isReady && previewMatch) { previewUrl = previewMatch[1]; break; }
                } else {
                  core.info(`Attempt ${attempt + 1}/20: no arcanea-ai-app row in vercel[bot] comment yet`);
                }
              } else {
                core.info(`Attempt ${attempt + 1}/20: no vercel[bot] comment yet`);
              }
              await sleep(15000);
            }
            if (!previewUrl) {
              core.warning('No live Vercel preview URL found after polling. Screenshots will be skipped.');
            } else {
              core.info('Preview URL: ' + previewUrl);
            }
            core.setOutput('url', previewUrl);

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@latest
          npx playwright install chromium --with-deps

      - name: Screenshot key routes
        env:
          PREVIEW_URL: ${{ steps.resolve-url.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          mkdir -p screenshots
          # playwright is installed globally above; expose it to require() in the inline script
          export NODE_PATH="$(npm root -g)"
          node - <<'JSEOF'
          const { chromium } = require('playwright');
          const BASE = (process.env.PREVIEW_URL || '').replace(/\/$/, '');
          if (!BASE) {
            console.error('No PREVIEW_URL set — skipping screenshots.');
            require('fs').writeFileSync('screenshots/SKIPPED.txt', 'No preview URL available.');
            process.exit(0);
          }
          const routes = [
            { path: '/', name: 'home' },
            { path: '/worlds', name: 'worlds' },
            { path: '/create', name: 'create' },
            { path: '/dashboard', name: 'dashboard' },
          ];
          // Vercel's preview deployments sit behind Deployment Protection (an auth wall) by
          // default — without this, Playwright only ever captures the login page. If a
          // Protection Bypass for Automation secret is configured (Vercel Project Settings ->
          // Deployment Protection), send it as a header on every request; this is a no-op
          // (and the screenshots stay blocked, same as before) when the secret isn't set.
          const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext(
              bypassSecret ? { extraHTTPHeaders: { 'x-vercel-protection-bypass': bypassSecret } } : {}
            );
            for (const route of routes) {
              const page = await context.newPage();
              await page.setViewportSize({ width: 1440, height: 900 });
              try {
                await page.goto(BASE + route.path, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForTimeout(1500);
                await page.screenshot({ path: 'screenshots/' + route.name + '-desktop.png', fullPage: true });
                await page.setViewportSize({ width: 390, height: 844 });
                await page.waitForTimeout(500);
                await page.screenshot({ path: 'screenshots/' + route.name + '-mobile.png', fullPage: true });
                console.log('Captured: ' + route.name);
              } catch (err) {
                console.error('Failed ' + route.name + ': ' + err.message);
                require('fs').writeFileSync('screenshots/' + route.name + '-FAILED.txt', err.message);
              } finally {
                await page.close();
              }
            }
            await browser.close();
          })();
          JSEOF

      - name: Gemini Vision Analysis
        id: gemini-analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIEW_URL: ${{ steps.resolve-url.outputs.url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64, urllib.request
          api_key = os.environ.get('GEMINI_API_KEY', '')
          preview_url = os.environ.get('PREVIEW_URL', 'unknown')
          pr_title = os.environ.get('PR_TITLE', 'unknown')

          def resolve_model(key):
            # gemini-2.0-flash was hardcoded here and started 404ing — Gemini model IDs
            # get retired over time. Ask the API what's actually available instead of
            # guessing a version string that will go stale again.
            #
            # A naive "contains flash" + alphabetical-descending sort previously picked
            # 'gemini-omni-flash-preview' (an experimental variant that 400'd on this
            # plain text+image request) — 'omni' sorts after numbered versions. Match
            # only the standard `gemini-<version>-flash` shape (no -preview/-exp/-image/
            # -audio/-tts/-live/-lite suffix) and pick the highest version numerically.
            import re
            fallback = 'models/gemini-2.0-flash'
            try:
              list_url = 'https://generativelanguage.googleapis.com/v1beta/models?key=' + key
              with urllib.request.urlopen(list_url, timeout=30) as resp:
                models = json.loads(resp.read()).get('models', [])
              pattern = re.compile(r'^models/gemini-(\d+(?:\.\d+)?)-flash$')
              candidates = []
              for m in models:
                if 'generateContent' not in m.get('supportedGenerationMethods', []):
                  continue
                match = pattern.match(m['name'])
                if match:
                  candidates.append((float(match.group(1)), m['name']))
              if candidates:
                candidates.sort(key=lambda c: c[0], reverse=True)
                return candidates[0][1]
              print('No standard gemini-<version>-flash model found, falling back to ' + fallback)
              return fallback
            except Exception as e:
              print('Model list lookup failed, falling back to ' + fallback + ': ' + str(e))
              return fallback

          images = []
          for fname in sorted(os.listdir('screenshots')):
            if fname.endswith('-desktop.png'):
              with open('screenshots/' + fname, 'rb') as f:
                b64 = base64.b64encode(f.read()).decode('utf-8')
              images.append({'name': fname.replace('-desktop.png', ''), 'base64': b64})
          if not images:
            open('screenshots/ai-report.md', 'w').write('**Visual QA**: No screenshots captured.')
            exit(0)
          if not api_key:
            open('screenshots/ai-report.md', 'w').write('**Visual QA**: GEMINI_API_KEY secret not set.')
            exit(0)
          route_names = ', '.join(i['name'] for i in images)
          prompt = (
            'You are a senior UX engineer reviewing a Vercel preview for Arcanea '
            '(dark, futuristic AI agent platform).\n'
            'PR: ' + pr_title + '\n'
            'Preview URL: ' + preview_url + '\n'
            'Screenshots provided: ' + route_names + '\n\n'
            'For EACH screenshot analyze:\n'
            '1. Visual Integrity - broken layouts, overlapping elements, invisible text?\n'
            '2. Design Consistency - dark/futuristic Arcanea aesthetic, fonts, colors, spacing?\n'
            '3. Functional Signals - buttons, nav, CTAs visible and positioned correctly?\n'
            '4. Responsiveness - any clipping or overflow?\n'
            '5. Regression Risk - anything worse than production quality?\n\n'
            'Then provide:\n'
            '- Overall verdict: PASS, WARN, or FAIL\n'
            '- Confidence score (0-100)\n'
            '- Issues found (with page name)\n'
            '- Things that look good\n'
            '- One recommendation if WARN or FAIL\n\n'
            'Format as clean markdown for a GitHub PR comment.'
          )
          parts = [{'text': prompt}]
          for img in images:
            parts.append({'text': '--- Screenshot: ' + img['name'] + ' ---'})
            parts.append({'inline_data': {'mime_type': 'image/png', 'data': img['base64']}})
          payload = json.dumps({
            'contents': [{'parts': parts}],
            'generationConfig': {'maxOutputTokens': 2048, 'temperature': 0.2}
          }).encode('utf-8')
          model_name = resolve_model(api_key)
          print('Using model: ' + model_name)
          url = 'https://generativelanguage.googleapis.com/v1beta/' + model_name + ':generateContent?key=' + api_key
          req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json'})
          try:
            with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())
            analysis = result['candidates'][0]['content']['parts'][0]['text']
          except Exception as e:
            analysis = '**Visual QA Error**: Gemini analysis failed - ' + str(e)
          open('screenshots/ai-report.md', 'w').write(analysis)
          print('Gemini analysis complete')
          print(analysis[:500])
          PYEOF

      - name: Post Visual QA report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('screenshots/ai-report.md', 'utf8'); }
            catch { report = 'Visual QA report could not be generated.'; }
            const body = [
              '## Visual QA Report - Gemini Vision',
              '',
              '**Preview**: ${{ steps.resolve-url.outputs.url }}',
              '**Routes**: home, worlds, create, dashboard',
              '**Viewport**: Desktop 1440px + Mobile 390px',
              '',
              '---',
              '',
              report,
              '',
              '---',
              '*Generated by Gemini Flash vision + Playwright screenshots*',
              '*Full screenshots in workflow artifacts*',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Visual QA Report') && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-screenshots-pr${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
