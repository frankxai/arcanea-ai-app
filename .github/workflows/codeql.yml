name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Weekly scan — Mondays 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Cost gate: skip on draft PRs — agents iterate free; scan runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # Source-only analysis — no project build required for JS/TS.
      - name: Perform CodeQL Analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

      - name: Warn when CodeQL upload is unavailable
        if: steps.analyze.outcome == 'failure'
        run: |
          echo "::warning::CodeQL analysis could not upload results. Enable GitHub code scanning for this repository to make CodeQL a hard release gate."
