name: Quality Canon Tier-1

# Tier-1 BLOCKING enforcement of QUALITY_CANON.md §10.1 — the rules already
# documented in canon as intent become mechanical gates here.
#
# This workflow adds the rules NOT covered by existing workflows:
#   - design-fence.yml  → covers banned fonts (Cinzel/Space Grotesk/Inter),
#                          banned hex literals, domMax (rules 1, 2)
#   - lockfile-drift.yml → covers package.json without pnpm-lock.yaml (rule 4)
#
# This workflow adds (rules 3, 5, 6, 7):
#   - SVG ArcaneanMark logo ban  (must use arcanea-mark.jpg per feedback_logo_never_svg)
#   - Claude-flow co-author contamination  (per feedback_no_coauthor_contamination)
#   - Empty catch blocks  (silent error suppression — silent-failure-hunter family)
#   - Commented-out code  (technical debt marker; TASTE.md Gate 6 anti-pattern)
#
# Pattern: diff-only checks. We only block when a violation is *introduced* by
# this PR. Existing matches in unchanged code don't block — allows incremental
# canonical migration without breaking real work in flight.
#
# Authority: QUALITY_CANON.md §10.1 (v0.1.0, shipped 2026-05-18).
# Reference: ~/.claude/projects/.../memory/feedback_quality_standard.md (the
# 7-gate excellence filter that birthed this canon).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - ".github/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.mjs"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-canon-tier1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Rule 3 — SVG logo ban
  # ============================================
  svg-logo-ban:
    name: Canon §10.1.3 — No SVG ArcaneanMark
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Diff-scan for SVG ArcaneanMark introductions
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Allowlist: feedback memory files + this workflow are allowed to
          # name the SVG so the policy can be documented.
          ADDED=$(git diff --no-color "$BASE_SHA" "$HEAD_SHA" -- apps packages \
                  ':(exclude)**/CLAUDE.md' \
                  ':(exclude)**/AGENTS.md' \
                  ':(exclude).github/workflows/quality-canon-tier1.yml' \
                  | grep -E '^\+[^+]' || true)

          if [ -z "$ADDED" ]; then
            echo "::notice::No added lines in apps/ or packages/ to scan."
            exit 0
          fi

          # Match SVG-shaped ArcaneanMark uses: imports of svg files, inline
          # SVG element, or React component that returns <svg> with the mark name.
          HITS=$(echo "$ADDED" | grep -E "(ArcaneanMark.*\.svg|import.*ArcaneanMark.*svg|<svg[^>]*arcanean-mark|arcanean-mark\.svg)" -i || true)

          if [ -n "$HITS" ]; then
            echo "::error title=Canon §10.1.3 violation: SVG ArcaneanMark is banned::Logo must use arcanea-mark.jpg (crystalline angular A) per feedback_logo_never_svg"
            echo "$HITS" | head -10 | sed 's/^/  /'
            echo
            echo "Reference: memory entry feedback_logo_never_svg.md — 'NEVER use SVG ArcaneanMark; always use arcanea-mark.jpg'"
            exit 1
          fi

          echo "::notice::Canon §10.1.3 holds — no SVG ArcaneanMark introduced."

  # ============================================
  # Rule 5 — No claude-flow / ruvnet co-author contamination
  # ============================================
  no-coauthor-contamination:
    name: Canon §10.1.5 — No claude-flow co-author
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan PR commits for forbidden co-author trailers
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get the full commit messages for every commit unique to this PR.
          MESSAGES=$(git log "$BASE_SHA..$HEAD_SHA" --pretty=format:"%H%n%B%n---END---" || true)

          if [ -z "$MESSAGES" ]; then
            echo "::notice::No new commits in PR to scan."
            exit 0
          fi

          # Forbidden patterns (per feedback_no_coauthor_contamination memory):
          # NEVER add Co-Authored-By claude-flow/ruvnet; Arcanea is sovereign.
          HITS=$(echo "$MESSAGES" | grep -iE "Co-Authored-By:.*\b(claude-flow|ruvnet|claude flow)" || true)

          if [ -n "$HITS" ]; then
            echo "::error title=Canon §10.1.5 violation: forbidden co-author trailer::PR commits contain Co-Authored-By trailers for claude-flow / ruvnet — Arcanea is sovereign, never attribute work to those projects"
            echo "$HITS" | head -10 | sed 's/^/  /'
            echo
            echo "Reference: memory entry feedback_no_coauthor_contamination.md"
            echo "Fix: amend commit messages to remove the Co-Authored-By trailer, or use 'git rebase -i' to clean the history before pushing."
            exit 1
          fi

          echo "::notice::Canon §10.1.5 holds — no forbidden co-author trailers."

  # ============================================
  # Rule 6 — No empty catch blocks
  # ============================================
  no-empty-catch:
    name: Canon §10.1.6 — No empty catch blocks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Diff-scan for empty catch blocks
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Scan only the unified diff of added lines for empty catch patterns.
          # We use the unified diff and look for patterns like:
          #   catch { }       (no parameter, empty body)
          #   catch(e) { }    (parameter, empty body)
          #   } catch { }     (inline)
          # These are silent-failure markers — see superpowers silent-failure-hunter.

          ADDED=$(git diff --no-color "$BASE_SHA" "$HEAD_SHA" -- '**/*.ts' '**/*.tsx' '**/*.js' '**/*.mjs' \
                  ':(exclude)**/node_modules/**' \
                  ':(exclude)**/.next/**' \
                  ':(exclude)**/dist/**' \
                  | grep -E '^\+[^+]' || true)

          if [ -z "$ADDED" ]; then
            echo "::notice::No added .ts/.tsx/.js lines to scan."
            exit 0
          fi

          # Match patterns:
          #   catch {}              — bare catch, no parameter
          #   catch ( anything ) {} — with parameter, single-line empty body
          # We don't catch multi-line empty bodies (catch { \n }) because that
          # requires multiline diff context and overlap with legitimate cleanup.
          # Tier-1 = pragmatic mechanical gate.
          HITS=$(echo "$ADDED" | grep -E '\bcatch\s*(\([^)]*\))?\s*\{\s*\}' || true)

          if [ -n "$HITS" ]; then
            echo "::error title=Canon §10.1.6 violation: empty catch block::Empty catch blocks silently swallow errors. Either log+rethrow, surface to the caller, or document why the swallow is correct."
            echo "$HITS" | head -10 | sed 's/^/  /'
            echo
            echo "Reference: superpowers:silent-failure-hunter — inadequate error handling and silent failure family"
            echo "Fix options:"
            echo "  1. Log the error: catch (e) { console.error('...', e); throw e; }"
            echo "  2. Document the swallow: catch { /* intentional: <reason> */ }"
            echo "  3. Add a real handler"
            exit 1
          fi

          echo "::notice::Canon §10.1.6 holds — no empty catch blocks introduced."

  # ============================================
  # Rule 7 — No commented-out code (heuristic)
  # ============================================
  no-commented-code:
    name: Canon §10.1.7 — No commented-out code (heuristic)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run commented-out-code heuristic
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Heuristic: 3+ consecutive added lines that begin with `//` AND
          # contain code-shaped tokens (function/const/let/var/import/return/
          # await/=>/;/<jsx-like>).
          #
          # We extract only the added-line side of the diff, group by file,
          # and run a small awk pass to detect runs.

          # Files we never check (these legitimately have many comment lines):
          EXCLUDES=(
            ':(exclude)**/node_modules/**'
            ':(exclude)**/.next/**'
            ':(exclude)**/dist/**'
            ':(exclude)**/build/**'
            ':(exclude)**/*.md'
            ':(exclude)**/*.mdx'
            ':(exclude)**/*.yaml'
            ':(exclude)**/*.yml'
            ':(exclude)**/*.json'
            ':(exclude)**/CLAUDE.md'
            ':(exclude)docs/**'
            ':(exclude)book/**'
            ':(exclude).arcanea/**'
            ':(exclude)wiki/**'
          )

          DIFF=$(git diff --no-color "$BASE_SHA" "$HEAD_SHA" -- '**/*.ts' '**/*.tsx' '**/*.js' '**/*.mjs' "${EXCLUDES[@]}" || true)

          if [ -z "$DIFF" ]; then
            echo "::notice::No added .ts/.tsx/.js lines to scan."
            exit 0
          fi

          # awk pass: walk the unified diff, track current file, count consecutive
          # added comment-code lines. Emit a fail line when run length >= 3.
          # Code-shaped tokens used to filter pure prose / TODOs.
          HITS=$(echo "$DIFF" | awk '
            BEGIN { run = 0; file = ""; out = 0 }
            /^diff --git a\// { gsub(/^diff --git a\//, ""); file = $0; sub(/ b\/.*$/, "", file); run = 0; next }
            /^\+\+\+ / { next }
            /^---/ { next }
            /^@@ / { run = 0; next }
            /^\+[[:space:]]*\/\// {
              # Strip leading + and whitespace, then check for code-shaped token.
              line = $0
              sub(/^\+[[:space:]]*\/\/[[:space:]]*/, "", line)
              if (line ~ /(function|const|let|var|import|export|return|await|=>|;[[:space:]]*$|<[A-Za-z]|class[[:space:]]|interface[[:space:]]|type[[:space:]]+[A-Za-z]+[[:space:]]*=)/) {
                run += 1
                if (run == 3) {
                  print file ": 3+ consecutive commented-out code lines"
                  out = 1
                }
              } else {
                run = 0
              }
              next
            }
            /^\+/ { run = 0; next }
            { run = 0 }
            END { exit(out) }
          ' || echo "VIOLATIONS_FOUND")

          if echo "$HITS" | grep -q "VIOLATIONS_FOUND\|consecutive commented-out code lines"; then
            echo "::error title=Canon §10.1.7 violation: commented-out code detected::Three or more consecutive comment lines containing code shapes. Delete the code (git history preserves it) or document why it must stay as a comment."
            echo "$HITS" | grep "consecutive" | head -10 | sed 's/^/  /'
            echo
            echo "Reference: TASTE.md Gate 6 — commented-out code is technical debt."
            echo "Fix: delete the dead code. Git history preserves it if you need it back."
            exit 1
          fi

          echo "::notice::Canon §10.1.7 holds — no commented-out code introduced."

  # ============================================
  # Status summary for branch protection
  # ============================================
  tier1-status:
    name: Quality Canon Tier-1 Status
    runs-on: ubuntu-latest
    needs: [svg-logo-ban, no-coauthor-contamination, no-empty-catch, no-commented-code]
    if: always()
    steps:
      - name: Aggregate Tier-1 results
        run: |
          echo "## Quality Canon Tier-1 Results" >> $GITHUB_STEP_SUMMARY
          echo "| Rule | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| §10.1.3 SVG logo ban | ${{ needs.svg-logo-ban.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| §10.1.5 No claude-flow co-author | ${{ needs.no-coauthor-contamination.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| §10.1.6 No empty catch | ${{ needs.no-empty-catch.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| §10.1.7 No commented-out code | ${{ needs.no-commented-code.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Rules 1, 2, 4 covered by existing design-fence.yml + lockfile-drift.yml._" >> $GITHUB_STEP_SUMMARY

          ALL_GREEN=true
          [ "${{ needs.svg-logo-ban.result }}" != "success" ] && ALL_GREEN=false
          [ "${{ needs.no-coauthor-contamination.result }}" != "success" ] && ALL_GREEN=false
          [ "${{ needs.no-empty-catch.result }}" != "success" ] && ALL_GREEN=false
          [ "${{ needs.no-commented-code.result }}" != "success" ] && ALL_GREEN=false

          if [ "$ALL_GREEN" = "false" ]; then
            echo "::error::Quality Canon Tier-1 had failures — see job summaries above"
            exit 1
          fi
          echo "Quality Canon Tier-1 PASSED."
